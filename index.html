<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Живая Книга</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: white; }
        .chapter { padding: 20px; margin: 10px; background: rgba(255,255,255,0.1); border-radius: 15px; cursor: pointer; }
        .chapter-locked { opacity: 0.6; position: relative; }
        .lock-icon { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: 24px; }
        .chapter-unlocked { opacity: 1; }
        .chapter-unlocked .lock-icon { display: none; }
        .buy-btn { background: #e94560; color: white; padding: 10px 20px; border: none; border-radius: 20px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <h1 style="text-align: center; padding: 20px;">Живая Книга</h1>

    <!-- Главы 1-3 (бесплатно) -->
    <div class="chapter" data-chapter="1" onclick="openChapter(1)">
        Глава 1: Субботнее утро
        <span class="lock-icon">🔓</span>
    </div>
    <div class="chapter" data-chapter="2" onclick="openChapter(2)">
        Глава 2: Вечер с Максом
        <span class="lock-icon">🔓</span>
    </div>
    <div class="chapter" data-chapter="3" onclick="openChapter(3)">
        Глава 3: Ночь с Лёшей
        <span class="lock-icon">🔓</span>
    </div>

    <!-- Главы 4-7 (платные) -->
    <div class="chapter chapter-locked" data-chapter="4" data-locked="true">
        Глава 4: Мастерская Артёма (199₽)
        <span class="lock-icon">🔒</span>
        <button class="buy-btn" onclick="buyChapter(4)">Купить</button>
    </div>
    <div class="chapter chapter-locked" data-chapter="5" data-locked="true">
        Глава 5: ...
        <span class="lock-icon">🔒</span>
    </div>
    <div class="chapter chapter-locked" data-chapter="6" data-locked="true">
        Глава 6: ...
        <span class="lock-icon">🔒</span>
    </div>
    <div class="chapter chapter-locked" data-chapter="7" data-locked="true">
        Глава 7: ...
        <span class="lock-icon">🔒</span>
    </div>

    <script>
    // === УНИВЕРСАЛЬНЫЙ PAYWALL ===
    (function() {
        // Подарочная ссылка
        const url = window.location.href;
        const hasGift = url.includes('gift=') && url.includes('universal=true');
        if (hasGift) {
            localStorage.setItem('zhivaya_kniga_paid', 'true');
            window.history.replaceState({}, '', window.location.pathname);
        }

        // Проверка доступа (все ключи)
        window.isBookPaid = function() {
            return localStorage.getItem('paid') === 'true' 
                || localStorage.getItem('zhivaya_kniga_paid') === 'true';
        };

        // Открытие глав
        window.unlockAllChapters = function() {
            document.querySelectorAll('.chapter-locked').forEach(function(ch) {
                ch.classList.remove('chapter-locked');
                ch.classList.add('chapter-unlocked');
                ch.removeAttribute('data-locked');
                ch.style.pointerEvents = 'auto';
                ch.onclick = function() { openChapter(this.dataset.chapter); };
            });
            document.querySelectorAll('.buy-btn').forEach(function(btn) {
                btn.style.display = 'none';
            });
        };

        // При загрузке
        if (window.isBookPaid()) {
            window.unlockAllChapters();
        }
    })();

    function openChapter(id) {
        if (id > 3 && !window.isBookPaid()) {
            alert('Глава платная. Нажмите "Купить"');
            return;
        }
        alert('Открываю главу ' + id);
    }

    function buyChapter(id) {
        alert('Переходим к оплате...');
        // Здесь ссылка на ЮKassa
    }
    </script>
</body>
</html>
