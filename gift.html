<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подарочная ссылка — Живая Книга</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1a1a2e, #16213e); color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        .container { padding: 40px; background: rgba(255,255,255,0.1); border-radius: 20px; }
        h1 { font-size: 28px; margin-bottom: 20px; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid #e94560; border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔓 Открываем доступ...</h1>
        <div class="spinner"></div>
        <p>Все главы открыты для вас!</p>
    </div>
    <script>
    (function() {
        const params = new URLSearchParams(window.location.search);
        const gift = params.get('gift');
        const exp = params.get('exp');
        if (exp && Math.floor(Date.now()/1000) > parseInt(exp)) {
            alert('Ссылка истекла'); return;
        }
        if (gift) {
            localStorage.setItem('zhivaya_kniga_paid', 'true');
            localStorage.setItem('zhivaya_kniga_gift', gift);
        }
        setTimeout(() => window.location.href = '/index.html', 2000);
    })();
    </script>
</body>
</html>
