<script>
const SCENES = {
  'g5_01':{text:'Я проснулась от солнца. Оно било в глаза сквозь тонкие шторы, и на мгновение я не поняла — где я.\n\nСуббота стала тремя разными жизнями. Лёша на балконе под дождём. Макс в тишине кинотеатра. Артём в золоте мастерской. Каждый — мир, в который я могла бы войти.\n\nА теперь воскресенье. И все они существуют одновременно, как наложенные друг на друга фотографии.\n\nТелефон звонил три раза, пока я спала. Три пропущенных. Три мира, которые ждут моего выбора.\n\nНо выбор — это не обязательно один. Возможно, он вообще не в них.\n\nЯ сижу на краю кровати. Кофе сам себя не сварит.',img:'img/g5_01_morning.jpg',choices:[{label:'Проверить телефон',target:'g5_02_phone'},{label:'Сварить кофе, не спеша',target:'g5_02_coffee'}]},
  'g5_02_phone':{text:'Я взяла телефон. Три уведомления. Три мира.\n\nЛёша, 00:42: «Прости за всё. Я уезжаю завтра. Хотел бы попрощаться».\n\nМакс, 08:15: «Знаешь, тот фильм — он о нас. Я не понял сразу. Может, увидимся?»\n\nАртём, 08:47: «Картина высохла. Приходи, если хочешь забрать. Или оставить».\n\nТри сообщения. Три двери. Три разных завтра.\n\nЯ читала их снова и снова, пока буквы не начали плыть.\n\nКаждый просит о встрече. Каждый хочет ответа.\n\nНо что, если ответ — не в выборе одного? Что, если он в выборе себя?',img:null,choices:[{label:'Ответить Лёше',target:'g5_03_lesha'},{label:'Ответить Максу',target:'g5_03_max'},{label:'Ответить Артёму',target:'g5_03_artem'}]},
  'g5_02_coffee':{text:'Я не взяла телефон. Сначала — кофе.\n\nЗерна в жернова, звук шлифования, аромат, который заполняет комнату как воспоминание. Это утренний ритуал, который я не нарушаю ни для кого.\n\nКофе в чашке, пар поднимается. Я сажусь у окна. Город просыпается — кто-то торопится, кто-то влюблён, кто-то одинок. Все вместе.\n\nИ я — среди них. Не выбравшая. Не отвергнувшая. Просто — существующая.\n\nТелефон лежит на столе. Молчит. Я молчу.\n\nМожет, молчание — тоже ответ?',img:null,choices:[{label:'Взять телефон',target:'g5_02_phone'},{label:'Уйти в город, одна',target:'g5_03_alone'}]},
  'g5_03_lesha':{text:'Я написала: «Где?»\n\nОтвет пришёл мгновенно: «Наш балкон. Через час».\n\nЯ оделась просто — джинсы, белая рубашка, волосы наверх. Не для него. Для себя. Потому что так чувствовала себя собой.\n\nБалкон был пуст. Но через минуту дверь заскрипела — и он вышел.\n\nЛёша в чёрном пальто, с чемоданом. Настоящим, коричневым, потёртым. Он правда уезжал.\n\n— Ты пришла, — сказал он, и в голосе не было ни радости, ни боли. Просто констатация.\n\n— Ты уезжаешь.\n\n— Да. Наверное, давно пора. Ты показала мне... что такое быть рядом. Я хочу найти это с кем-то, кто сможет принять меня целиком.\n\nОн посмотрел на меня. Долго. Как прощающийся.\n\n— Но если передумаешь — я буду там. Всегда.',img:'img/g5_02_balcony.jpg',choices:[{label:'Попросить его остаться',target:'g5_04_lesha_stay'},{label:'Попрощаться',target:'g5_04_lesha_bye'}]},
  'g5_03_max':{text:'Я написала: «Когда?»\n\nОн ответил сразу: «Сейчас. Тот же кинотеатр. Последний сеанс».\n\nЯ пошла. Не знаю почему — может, потому что Макс никогда не спешил. Он всегда ждал. И это было редкостью.\n\nКинотеатр был пуст. Не потому что утро — потому что он закрывался. Последний день работы. Макс стоял у кассы, в простой футболке, с ключами в руке.\n\n— Я купил это место, — сказал он, не поворачиваясь. — Ну, почти. Хочу сделать свой киноклуб. Маленький. Для своих.\n\n— Красиво, — сказала я.\n\n— Ты — первая, кому я сказал. Даже до мамы не дошёл.\n\nОн наконец повернулся. Улыбнулся. Той самой, тихой.\n\n— Хочешь быть первой зрительницей?',img:'img/g5_03_cinema.jpg',choices:[{label:'Сказать «да»',target:'g5_04_max_yes'},{label:'Предложить подумать',target:'g5_04_max_think'}]},
  'g5_03_artem':{text:'Я написала: «Скоро буду».\n\nОтвета не было. Но я знала — он ждёт.\n\nМастерская пахла так же — маслом, кофе, свободой. Но чего-то не хватало. Потом я поняла — музыки. Она не играла.\n\nАртём стоял у окна. На мольберте — картина. Законченная.\n\nНа ней была я. Не фотографично — эмоционально. В золоте и охре, в линиях, которые колебались между смелостью и нежностью.\n\n— Забери её, — сказал он, не оборачиваясь. — Или оставь. Я не могу смотреть каждый день на то, что у меня нет.\n\nЯ подошла. Положила руку ему на плечо. Он вздрогнул — не от прикосновения, от неожиданности.\n\n— Ты рисуешь меня лучше, чем я существую, — сказала я.\n\n— Это потому что я вижу тебя такой, какая ты есть. Когда ты сама забываешь.',img:'img/g5_04_paint.jpg',choices:[{label:'Забрать картину и остаться',target:'g5_04_artem_stay'},{label:'Предложить рисовать вместе',target:'g5_04_artem_together'}]},
  'g5_03_alone':{text:'Я не взяла телефон. Надела кроссовки и вышла.\n\nГород в воскресенье утром — это другое место. Без спешки, без костюмов, без притворства. Мамы с колясками, бегуны, пожилые пары, идущие медленно.\n\nЯ шла без направления. Повернула налево, потом направо, потом туда, куда вёл запах свежей выпечки.\n\nСела в кафе с окном на улицу. Заказала капучино и круассан. Телефон остался дома — и это было свободой.\n\nТри мира ждали ответа. А я выбрала четвёртый — свой.\n\nКапучино был хорошим. Круассан — ещё лучше. А за окном жизнь продолжалась без моих выборов.\n\nИ это было прекрасно.',img:null,choices:[{label:'Вернуться домой, решившая',target:'g5_04_alone_decided'},{label:'Продолжить гулять',target:'g5_04_alone_walk'}]},
  'g5_04_lesha_stay':{text:'— Не уезжай, — сказала я. Горло сжало.\n\nЛёша замер. Чемодан в руке показался невесомым — или он просто забыл, что держит его.\n\n— Ты не знаешь, что просишь, — тихо сказал он. — Я... я ломаю всё, что трогаю. Это мой талант.\n\n— Тогда сломай меня, — ответила я. — Но рядом. Не на расстоянии.\n\nОн отпустил чемодан. Он упал — глухой звук, как будто что-то закончилось.\n\n— Ты уверена?\n\nЯ кивнула. Он подошёл. Обнял. Долго, так, что я чувствовала его сердце.\n\n— Тогда мы начнём сначала. Честно. Без тайн.\n\n— Без тайн, — повторила я.\n\nЧемодан остался на балконе. Мы — ушли вместе.',img:null,choices:[]},
  'g5_04_lesha_bye':{text:'Я подошла ближе. Положила ладонь ему на грудь — туда, где билось сердце.\n\n— Иди, — сказала я. — Найди своё счастье. Оно где-то там.\n\nЛёша закрыл глаза. Потом открыл — и в них было всё, что мы не сказали.\n\n— Ты могла бы быть моим, — прошептал он.\n\n— Я и так твоя. Просто — не рядом.\n\nОн улыбнулся. Печально, но по-настоящему.\n\n— Знаешь, почему я тебя полюбил? Потому что ты никогда не притворялась. Даже когда мне хотелось, чтобы ты притворилась.\n\nОн наклонился. Поцеловал мой лоб. Повернулся. Взял чемодан.\n\n— До встречи, — сказал он. И ушёл.\n\nЯ осталась на балконе. Смотрела, как он исчезает. И плакала — не потому что он ушёл. Потому что наконец-то позволила себе это чувство.',img:null,choices:[]},
  'g5_04_max_yes':{text:'— Да, — сказала я. Без сомнений. Впервые за всё время — без сомнений.\n\nМакс улыбнулся. Не той тихой улыбкой — широко, открыто, как ребёнок.\n\n— Серьёзно?\n\n— Серьёзно. Покажи мне свой киноклуб. С самого начала.\n\nОн взял меня за руку. Повёл в зал — пустой, с мягкими креслами, с запахом попкорна и старой плёнки.\n\n— Здесь будет всё. Классика. Независимое кино. Ночные марафоны. И ты — если захочешь.\n\n— Я хочу, — сказала я. — Начни с чего-нибудь красивого.\n\nОн включил проектор. Белый свет заполнил зал. Пыльцы танцевали, как маленькие звёзды.\n\n— Это ещё не фильм, — засмеялся он. — Просто свет.\n\n— Свет тоже красивый, — сказала я, и прижалась к нему.\n\nОн обнял меня. Проектор гудел. И это было нашим началом.',img:null,choices:[]},
  'g5_04_max_think':{text:'— Дай мне время, — сказала я.\n\nМакс кивнул. Без обиды, без давления. Просто кивнул.\n\n— Я подожду. Не торопись. Я... я привык ждать хорошие вещи.\n\nОн дал мне ключ от кинотеатра. Маленький, потёртый, с брелоком в виде камеры.\n\n— Это на случай, если захочешь прийти, когда меня нет. Дверь всегда открыта для тебя.\n\n— Зачем мне ключ?\n\n— Чтобы ты знала: это твоё место. Даже если ты ещё не решила, хочешь ли быть со мной.\n\nЯ взяла ключ. Тёплый от его ладони.\n\n— Это самое красивое, что мне кто-то дарил, — сказала я.\n\n— Тогда ты мало где была, — усмехнулся он. — Иди. Думай. Я тут.\n\nЯ вышла. Ключ лежал в кармане, тяжёлый от значимости.\n\nДверь захлопнулась за мной. Но не навсегда. Он сказал — она открыта. И я ему верила.',img:null,choices:[]},
  'g5_04_artem_stay':{text:'Я взяла картину со мольберта. Она была тяжелее, чем я думала - не физически, а по значимости.\n\n- Забираю, - сказала я. - Но оставляю тебе себя.\n\nАртём обернулся. В его глазах - удивление, потом тепло, потом что-то похожее на мир.\n\n- Ты знаешь, что это значит? - спросил он.\n\n- Знаю. Это значит, что я остаюсь. Не как модель. Как... как мы.\n\nОн подошёл ближе. Взял картину из моих рук, поставил на пол. Потом взял меня.\n\n- Я нарисую тебя тысячу раз, - прошептал он в мои волосы. - И ни разу не устану. Потому что каждый раз ты - новая.\n\n- А если я изменюсь?\n\n- Тогда я буду рисовать тебя изменившуюся. И любить новую версию.\n\nМы стояли у окна. Закатное солнце заливало мастерскую. Картина лежала на полу - забытая, незаконченная, наша.',img:null,choices:[]},
  'g5_04_artem_together':{text:'- Давай рисовать вместе, - сказала я. - Не меня. Нас.\n\nАртём повернулся. В его взгляде - вопрос, надежда, страх.\n\n- Ты не умеешь рисовать, - сказал он. Не обидно. Просто факт.\n\n- Научишь. Ты ведь учил меня видеть. Теперь научи создавать.\n\nОн взял чистый холст. Положил его на мольберт. Дал мне кисть - ту самую, серебристую, которой рисовал мои плечи.\n\n- Ты - цвет. Я - тень. Вместе - картина.\n\nМы работали до рассвета. Его рука на моей руке, направляющая. Мои ошибки, которые он называл \'неожиданными решениями\'.\n\nУтром на холсте была абстракция - синие и золотые вихри, и в центре белое пространство, куда мы ещё не дошли.\n\n- Это мы, - сказал он. - Не законченные. Но вместе.\n\n- Давай никогда не заканчивать, - прошептала я.\n\n- Художники редко заканчивают. Мы просто останавливаемся.',img:null,choices:[]},
  'g5_04_alone_decided':{text:'Я вернулась домой. Солнечный свет заливал комнату.\n\nТелефон лежал на столе. Три уведомления. Три мира.\n\nЯ взяла его. Не открывала сообщения - просто смотрела на экран, пока он не погас.\n\nПотом написала каждому. Одно и то же:\n\n\'Спасибо. Ты показал мне часть себя. Но я выбираю быть целой. Не половиной чьей-то истории. А своей собственной.\'\n\nЯ не знаю, что будет завтра. Не знаю, кого встречу через год. Но знаю одно: я готова. К себе. К миру. К любви - когда придёт, не потому что я её искала, а потому что я уже люблю себя.\n\nТри \'спасибо\'. Три \'прости\'. Три свободы.\n\nЯ отложила телефон. Включила музыку. Начала танцевать - одна, в своей комнате, под солнечным светом.\n\nИ это было началом.',img:null,choices:[]},
  'g5_04_alone_walk':{text:'Я не вернулась домой. Пошла дальше.\n\nБез карты, без плана, без телефона. Город открывался мне - дворики, мостки, кафе, где никто не знал моего имени.\n\nВ парке я села на скамейку. Рядом - старая женщина с книгой.\n\n- Хороший день, - сказала она. Не вопрос.\n\n- Да, - ответила я. - Хороший.\n\n- Вы одни?\n\n- Да.\n\n- Отлично. Лучшее состояние - быть одной и не одинокой. Это редкость. Цените.\n\nЯ улыбнулась. Она улыбнулась. Мы сидели молча - две незнакомки, которые поняли друг друга без слов.\n\nПотом я пошла дальше. Солнечный свет грел лицо. Город шумел вокруг - живой, настоящий, мой.\n\nТри мужчины. Три истории. Три урока о себе.\n\nА теперь - четвёртая история. Моя собственная.\n\nЯ не знала, куда иду. Но шла. Уверенно. Своим путём.\n\nИногда это всё, что нужно.',img:null,choices:[]}
};

let currentScene = 'g5_01';
let sceneHistory = [];

function renderScene(sceneId) {
  const scene = SCENES[sceneId];
  if (!scene) return;
  currentScene = sceneId;
  if(typeof trackScene==="function")trackScene(sceneId);
  sceneHistory.push(sceneId);
  const app = document.getElementById('app');
  let html = '<div class="fade-in">';
  if (scene.img) {
    html += '<img class="scene-img" src="' + scene.img + '" alt="" onload="this.classList.add(\'loaded\')">';
  }
  html += '<div class="scene-text">' + scene.text.replace(/\n/g, '<br>') + '</div>';
  if (scene.choices.length > 0) {
    html += '<div class="choices">';
    scene.choices.forEach(function(c) {
      html += '<button class="choice-btn" onclick="choose(\'' + c.target + '\')">' + c.label + '</button>';
    });
    html += '</div>';
  } else {
    if(typeof trackComplete==='function')trackComplete();
    html += '<div class="end-marker"><p>~ Конец истории ~</p><p style="margin-top:10px;font-size:0.9em">Живая Книга — Глава 5, Воскресенье</p></div>';
  }
  html += '</div>';
  app.innerHTML = html;
  const maxDepth = 5;
  const progress = Math.min((sceneHistory.length / maxDepth) * 100, 100);
  document.getElementById('progressFill').style.width = progress + '%';
  window.scrollTo({top:0,behavior:'smooth'});
}
function choose(targetId) { renderScene(targetId); }
renderScene('g5_01');
</script>
