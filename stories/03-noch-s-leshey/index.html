<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Глава 3 — Ночь с Лёшей | Живая Книга</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Montserrat',sans-serif;background:#1a1410;color:#f5ede4;line-height:1.7;min-height:100vh}
  .container{max-width:720px;margin:0 auto;padding:20px 16px 60px}
  .chapter-header{text-align:center;padding:40px 0 30px;border-bottom:1px solid rgba(212,175,137,0.2);margin-bottom:30px}
  .chapter-header h1{font-family:'Cormorant Garamond',serif;font-size:2.4em;color:#d4af89;font-weight:400;font-style:italic;margin-bottom:6px}
  .chapter-header .subtitle{font-size:0.85em;color:#a89080;letter-spacing:3px;text-transform:uppercase}
  .scene-text{font-family:'Cormorant Garamond',serif;font-size:1.35em;line-height:1.9;color:#f5ede4;margin-bottom:28px;white-space:pre-wrap}
  .scene-img{width:100%;border-radius:8px;margin-bottom:28px;box-shadow:0 8px 32px rgba(0,0,0,0.5);opacity:0;transition:opacity 0.8s ease}
  .scene-img.loaded{opacity:1}
  .choices{display:flex;flex-direction:column;gap:12px;margin-top:10px}
  .choice-btn{font-family:'Montserrat',sans-serif;background:transparent;border:1px solid rgba(212,175,137,0.4);color:#d4af89;padding:16px 20px;border-radius:6px;cursor:pointer;font-size:1em;transition:all 0.3s ease;text-align:left;line-height:1.5}
  .choice-btn:hover{background:rgba(212,175,137,0.1);border-color:#d4af89;transform:translateX(4px)}
  .end-marker{text-align:center;margin-top:40px;padding-top:30px;border-top:1px solid rgba(212,175,137,0.2)}
  .end-marker p{font-family:'Cormorant Garamond',serif;font-style:italic;color:#a89080;font-size:1.1em}
  .fade-in{animation:fadeIn 0.6s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .nav-bar{display:flex;justify-content:space-between;align-items:center;padding:16px 0;margin-bottom:10px;font-size:0.8em;color:#a89080}
  .nav-bar a{color:#d4af89;text-decoration:none;transition:opacity 0.2s}
  .nav-bar a:hover{opacity:0.7}
  .progress-bar{height:2px;background:rgba(212,175,137,0.15);margin-bottom:30px;border-radius:1px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,#d4af89,#c4956a);transition:width 0.5s ease;border-radius:1px}
  @media(max-width:600px){.chapter-header h1{font-size:1.9em}.scene-text{font-size:1.2em}}
</style>
</head>
<body>
<div class="container">
  <div class="nav-bar">
    <a href="/book/">&larr; Книга</a>
    <span>Глава 3 — третья</span>
  </div>
  <div class="chapter-header">
    <div class="subtitle">Глава третья</div>
    <h1>Ночь с Лёшей</h1>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div id="app"></div>
</div>
<script>
const SCENES = {
    'g3_01':{text:'Ты входишь в \'Мокко\'. Через неделю. Не случайно - специально.\n\nОн стоит за стойкой. Не в фартуке официанта - в своей футболке, с папоротником на шее. Волосы растрепаны. Руки моют чашку, но он смотрит не на нее - на дверь. На тебя.\n\n- Ты пришла, - говорит он. Не вопрос.\n\n- Пришла.\n\n- Значит, решила.\n\n- Значит, захотела. Это разные вещи.\n\nОн смеется. Откладывает чашку. Обходит стойку. Стоит перед тобой - ближе, чем нужно, дальше, чем хочется.\n\n- Кофе? Или сразу к делу?',img:'img/g3-home.jpg',choices:[{label:'Кофе. Не спеши.',target:'g3_02_coffee'},{label:'К делу. Что предлагаешь?',target:'g3_02_direct'}]},
    'g3_02_coffee':{text:'- Кофе, - говоришь ты. - И время.\n\nОн кивает. Не разочарован. Напротив - уважает.\n\nГотовит медленно. Не спешит. Латте-арт получается не с первого раза - он ругается, стирает, начинает заново.\n\n- Перфекционист? - спрашиваешь ты.\n\n- Просто хочу, чтобы тебе понравилось.\n\n- Мне нравится уже. Процесс.\n\nОн смотрит на тебя. Долго. Потом ставит чашку - сердце из пены.\n\n- Для тебя. Только для тебя.\n\nКафе пустеет. Последний клиент уходит. Он запирает дверь. Не спрашивая. Ты не возражаешь.',img:null,choices:[{label:'Спросить, что он чувствует',target:'g3_03_feel'},{label:'Промолчать, пить кофе',target:'g3_03_sip'}]},
    'g3_02_direct':{text:'- К делу, - говоришь ты. - Что предлагаешь?\n\nЛёша улыбается. Не той улыбкой из кафе - другой. Смелее. Старше.\n\n- Предлагаю увидеть меня. Не официанта. Меня. В моем мире. "Мокко" - это маска. А за ним - я.\n\nОн ведет тебя на кухню. Не гламурно. Холодильник с наклейками, цветы на подоконнике, запах корицы.\n\n- Здесь я живу. Здесь я - я. Без \'добро пожаловать\'. Без \'что будете\'. "Мокко" закрывается через час. А до тех пор - это мое.\n\nТы смотришь. Видишь его - настоящего. Не того, кто носит поднос. Того, кто любит корицу и выращивает орхидеи на кухне.',img:'img/g3-home.jpg',choices:[{label:'Помочь ему закрывать кафе',target:'g3_03_help'},{label:'Осмотреть его мир',target:'g3_03_look'}]},
    'g3_03_feel':{text:'- Что ты чувствуешь? - спрашиваешь ты. - Прямо сейчас.\n\nЛёша останавливается. Среди пустого кафе. Между столов.\n\n- Страх. И радость. И то, что давно не чувствовал - надежду.\n\n- Страх чего?\n\n- Что ты уйдешь. Что я снова останусь один с посудой и папоротником.\n\n- А радость?\n\n- Что ты здесь. Сейчас. Пока еще.\n\nОн подходит. Останавливается на расстоянии вытянутой руки. Как будто ждет разрешения.\n\n- Надежда?\n\n- Что \'пока еще\' станет \'навсегда\'. Хотя бы на ночь.',img:null,choices:[{label:'Дать ему надежду',target:'g3_04_hope'},{label:'Сказать, что ничего не обещаешь',target:'g3_04_nothing'}]},
    'g3_03_sip':{text:'Ты молчишь. Пьешь кофе. Сердце тает на губах.\n\nЛёша садится напротив. Не лезет с разговорами. Просто смотрит. Как будто ты - картина, которую он никогда не устанет разглядывать.\n\n- Ты умеешь молчать, - говорит он наконец. - Это редкость. Люди боятся тишины. Заполняют ее словами. Мусором.\n\n- Тишина не пустая, - говоришь ты. - Она полная. Если с правильным человеком.\n\n- Я правильный?\n\n- Сегодня - да. Завтра - посмотрим.\n\nОн смеется. Не обижается. Понимает игру.\n\n- Тогда давай жить сегодня. Завтра подождет.',img:null,choices:[{label:'Согласиться',target:'g3_04_today'},{label:'Спросить про завтра',target:'g3_04_tomorrow'}]},
    'g3_03_help':{text:'Ты помогаешь ему. Собираешь чашки, моешь, вытираешь. Он смотрит - удивлен, что кто-то делает это добровольно.\n\n- Ты не должна, - говорит он.\n\n- Хочу. Это тоже часть тебя - мыть посуду после чужих историй.\n\n- Чужих?\n\n- Каждый клиент - история. Ты их слушаешь. Я вижу. В твоих глазах - их радости, их боли. Ты - хранитель чужих секретов.\n\nОн замолкает. Потом говорит тихо:\n\n- А свои секреты? Кто их хранит?\n\n- Я, - говоришь ты. - Если захочешь рассказать.\n\nОн смотрит на тебя. Долго. Потом обнимает. Не поцелуй - обнимает. Как человек, который давно не обнимал того, кто обнимает в ответ.',img:null,choices:[{label:'Обнять крепче',target:'g3_04_tight'},{label:'Отпустить, посмотреть в глаза',target:'g3_04_eyes'}]},
    'g3_03_look':{text:'Ты осматриваешь его мир. Орхидеи на подоконнике - три штуки, одна цветет. Холодильник с наклейками из разных городов. Париж. Прага. Берлин.\n\n- Был везде? - спрашиваешь ты.\n\n- Хотел. Наклейки - от друзей. Я никуда не ездил. Весь мир - в этом кафе.\n\n- Почему?\n\n- Боялся. Что если уеду - не захочу возвращаться. А здесь... здесь все, что у меня есть.\n\nТы берешь его руку. Он вздрагивает - не от неожиданности. От тепла.\n\n- Теперь у тебя есть я, - говоришь ты. - Хотя бы сегодня. Хотя бы ночью.\n\n- Это больше, чем у меня было за последний год. За последние пять.',img:null,choices:[{label:'Поцеловать его на кухне',target:'g3_04_kiss'},{label:'Сказать, что пойдешь с ним куда угодно',target:'g3_04_anywhere'}]},
    'g3_04_hope':{text:'- Я даю тебе надежду, - говоришь ты. - Не обещание. Надежду. Это другое.\n\nЛёша кивает. В глазах - благодарность, которую нельзя выразить словами.\n\n- Надежда - это свет в конце коридора. Я пойду к ней. Медленно. Но пойду.\n\nНочь. Он ведет тебя на крышу. "Мокко" снизу - огоньки, город - за ним. Вы сидите на парапете, ноги свисают в темноту.\n\n- Знаешь, почему я люблю крышу? - спрашивает он. - Потому что здесь я не официант. Не хозяин. Просто человек под звездами.\n\n- Сегодня ты - мой человек под звездами.\n\nОн поворачивается. Целует тебя. Нежно, как первый снег.\n\nНадежда сбывается. Постепенно. Ночь за ночью.',img:'img/g3-roof.jpg',choices:[]},
    'g3_04_nothing':{text:'- Я ничего не обещаю, - говоришь ты. - Ни тебе. Ни себе. Ни кому.\n\nЛёша молчит. Потом кивает.\n\n- Честно. Это больно, но честно. Лучше, чем ложь.\n\nОн открывает дверь. Провожает до порога. Улица темная, влажная.\n\n- Я буду здесь, - говорит он. - Завтра. Послезавтра. Всегда. Не потому что обещаю. Потому что не умею иначе.\n\nТы уходишь. Не оборачиваешься. Но улыбаешься - потому что знаешь:\n\nКто-то ждет. Кто-то настоящий. И когда будешь готова - он будет там. С кофе. С папоротником. С собой.',img:null,choices:[]},
    'g3_04_today':{text:'- Давай жить сегодня, - говоришь ты.\n\nЛёша улыбается. Широко. Без маски.\n\n- Тогда закрываем кафе. Идем. Покажу тебе свой настоящий мир.\n\nОн ведет тебя к реке. Ночная вода шепчет. Фонари отражаются в ряби.\n\n- Здесь я прихожу, когда мир тяжелый. Здесь я - не официант. Не никто. Просто я.\n\n- Ты - Лёша. И этого достаточно.\n\nОн обнимает тебя. У воды. Под мостом. Ночь вокруг - как обещание, которое не нужно произносить вслух.\n\nСегодня стало длиннее. Завтра подождет.',img:'img/g3-river.jpg',choices:[]},
    'g3_04_tomorrow':{text:'- А что с завтра? - спрашиваешь ты.\n\nЛёша смеется. Не от радости. От правды.\n\n- Завтра я открою кафе. Сделаю кофе. Улыбнусь людям. А потом - подожду. Что ты придешь. Снова.\n\n- А если нет?\n\n- Буду ждать дальше. Я хорошо жду. Это мой талант.\n\nТы смеешься. Он смеется. Кафе смеется вместе с вами - скрипучими половицами и звоном чашек.\n\n- Пойдем, - говорит он. - Не уходить. Просто - пойдем. Куда-нибудь. Вместе. Сейчас.\n\nТы идешь. Рука в руке. Завтра подождет.',img:null,choices:[]},
    'g3_04_tight':{text:'Ты обнимаешь его крепче. Чувствуешь, как он вздыхает - глубоко, с полной грудью. Как будто впервые задолго.\n\n- Спасибо, - шепчет он. - За то, что обняла. За то, что осталась. За то, что видишь меня.\n\n- Я вижу тебя, - говоришь ты. - Не официанта. Не парня из кафе. Тебя.\n\n- А я вижу тебя. Ту, которая приходит. Которая остается. Которая - настоящая.\n\nНочь вне окон. Кафе пусто. Но внутри - тепло. Два человека. Обнимаются. Не спеша. Без причины. Просто потому что могут.\n\nЭто - счастье. Не громкое. Тихое. Его.',img:'img/g3-home.jpg',choices:[]},
    'g3_04_eyes':{text:'Ты отпускаешь его. Смотришь в глаза. Он смотрит в твои.\n\nМежду вами - молчание. Не неловкое. Наполненное. Как комната перед грозой.\n\n- Что ты видишь? - спрашивает он.\n\n- Человека. Который устал быть сильным. Который хочет позволить себе быть слабым. Хотя бы ночь.\n\n- Я могу? - его голос дрожит. - Позволить себе?\n\n- Со мной - можешь. Сейчас. Здесь. В этом кафе, которое закрылось для всех, кроме нас.\n\nОн закрывает глаза. Одна слеза. Не из горя. Из облегчения.\n\n- Тогда останься. Ночь. Может - дольше. Не обещаю ничего, кроме себя. Настоящего. Бroken, но настоящего.\n\n- Broken - значит настоящий. Целые люди - фальшивка.\n\nОн смеется сквозь слезы. Ты смеешься. Кафе их первое свидание - и, может быть, не последнее.',img:'img/g3-home.jpg',choices:[]},
    'g3_04_kiss':{text:'Ты целуешь его на кухне. Между холодильником и орхидеями.\n\nПоцелуй - не торопливый, не сценичный. Настоящий. С вкусом корицы и его губной помадой.\n\n- Я мечтал об этом, - шепчет он. - Каждую смену. Каждый раз, когда наливаю кому-то кофе.\n\n- Больше не мечтай. Делай.\n\nОн целует снова. Глубже. Руки в волосах. Тело к телу. Коробка с кофе падает - им все равно.\n\n- Я - не официант, - говорит он между поцелуями.\n\n- Я знаю. Ты - Лёша. И этого достаточно.\n\nКухня становится их спальней. Кафе - их миром. Ночь - их вечностью.',img:null,choices:[]},
    'g3_04_anywhere':{text:'- Я пойду с тобой куда угодно, - говоришь ты. - В этот момент. С этим человеком.\n\nЛёша смотрит на тебя. Не верит. Потом верит.\n\n- Тогда пойдем. Далеко. Хотя бы до утра.\n\nОн берет ключи. Выключатель - и кафе погружается в темноту. Только выходной свет над дверью.\n\nОн ведет тебя по ночным улицам. Мимо спящих домов, мимо шепчущих деревьев. К реке. К мосту. К рассвету, который еще не начался.\n\n- Знаешь, что самое прекрасное? - спрашивает он.\n\n- Что?\n\n- Что ты здесь. Сейчас. Не \'может быть\'. Не \'завтра\'. А сейчас. Это - все, что мне нужно.\n\nТы молчишь. Просто держишь его руку. И идешь. Куда-нибудь. Вместе.',img:'img/g3-river.jpg',choices:[]}
};
let currentScene = 'g3_01';
let sceneHistory = [];
function renderScene(sceneId) {
  const scene = SCENES[sceneId];
  if (!scene) return;
  currentScene = sceneId;
  sceneHistory.push(sceneId);
  const app = document.getElementById('app');
  let html = '<div class="fade-in">';
  if (scene.img) {
    html += '<img class="scene-img" src="' + scene.img + '" alt="" onload="this.classList.add(\'loaded\')">';
  }
  html += '<div class="scene-text">' + scene.text.replace(/\n/g, '<br>') + '</div>';
  if (scene.choices.length > 0) {
    html += '<div class="choices">';
    scene.choices.forEach(function(c) {
      html += '<button class="choice-btn" onclick="choose(\'' + c.target + '\')">' + c.label + '</button>';
    });
    html += '</div>';
  } else {
    html += '<div class="end-marker"><p>~ Конец главы ~</p><p style="margin-top:10px;font-size:0.9em">Конец истории</p></div>';
  }
  html += '</div>';
  app.innerHTML = html;
  const maxDepth = 5;
  const progress = Math.min((sceneHistory.length / maxDepth) * 100, 100);
  document.getElementById('progressFill').style.width = progress + '%';
  window.scrollTo({top:0,behavior:'smooth'});
}
function choose(targetId) { renderScene(targetId); }
renderScene(currentScene);
</script>
</body>
</html>
