<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap');

<div class="container">

    <h1>Вечер с Максом</h1>
  </div>

  <div id="app"></div>
</div>
<script>
const SCENES = {
    'g2_01':{text:'Ты стоишь перед галереей. В окнах — тёплый свет, тени картин на стенах. Макс сказал приходить после закрытия.\n\nДверь открывается до того, как ты успеваешь постучать. Он стоит в чёрной водолазке, в руке — бокал вина, которого ещё нет.\n\n— Я ждал, — говорит он. — Не потому что опаздывал. Потому что хотел быть первым, кого ты увидишь, войдя.\n\nГалерея пуста. Только вы двое и сто картин — свидетелей.\n\n— Хочешь экскурсию? Или сразу к секретному залу?',img:'img/g2-gallery.jpg',choices:[{label:'Экскурсия — медленно, со вкусом',target:'g2_02_tour'},{label:'Секретный зал — сразу',target:'g2_02_secret'}]},
    'g2_02_tour':{text:'Он ведёт тебя между рядами. Каждая картина — с историей. Не из каталога, из жизни. Эту он видел в Берлине, эту — украл у заката в Ницце.\n\n— Я не художник, — говорит он. — Я собиратель моментов. Как пчеловод, только с красками.\n\nОн останавливается у полотна — женский силуэт в золоте.\n\n— Эту я не продаю. Она напоминает мне о тебе. Ещё до того, как мы встретились.\n\nТы смотришь на него. Он не улыбается. Говорит правду — и это сильнее любой шутки.',img:null,choices:[{label:'Спросить, что он видит в тебе',target:'g2_03_see'},{label:'Промолчать, просто быть рядом',target:'g2_03_silence'}]},
    'g2_02_secret':{text:'Он берёт тебя за руку и ведёт за чёрную штору. Там — комната без окон, один стул, один прожектор, и картина на стене.\n\nПолотно огромное. Два силуэта — неразличимых, сплетённых. Цвета тёплые, почти горящие.\n\n— Это то, что я не показываю никому. Моя тайна. Моя...\n\nОн замолкает. Ищет слово.\n\n— Моя надежда. Что такое возможно.\n\nТы стоишь перед картиной. Она дышит. Как живое существо.',img:'img/g2-secret.jpg',choices:[{label:'Сесть на стул, смотреть',target:'g2_03_chair'},{label:'Обнять его сзади',target:'g2_03_hug'}]},
    'g2_03_see':{text:'— Что ты видишь во мне? — спрашиваешь ты.\n\nМакс отходит от картины. Смотрит на тебя так, будто видит в первый раз.\n\n— Ты спрашиваешь серьёзно? — он смеётся, но не от веселья. От неровности.\n\n— Вижу того, кто не притворяется. Кто пришёл сюда не потому что должна, а потому что захотела. Это... редкость. Всё реже.\n\nОн подходит ближе. На расстояние вытянутой руки.\n\n— Я устал от игр. От танцев. От того, чтобы быть забавным. С тобой я не хочу быть забавным. Хочу быть настоящим.\n\nТы чувствуешь его запах — вино, древесина, что-то ещё. Что-то его.',img:null,choices:[{label:'Сказать, что хочешь того же',target:'g2_04_truth'},{label:'Спросить про ужин',target:'g2_04_dinner'}]},
    'g2_03_silence':{text:'Ты молчишь. Просто стоишь рядом с ним, оба смотрите на золотой силуэт.\n\nМакс не требует слов. Он дышит рядом — ровно, спокойно. Это молчание не неловкое. Оно... полное. Как чаша, до краёв налитая теплом.\n\n— Знаешь, — наконец говорит он. — В галерее тихо. Но с тобой тишина другая. Она не пустая. Она... присутствует.\n\nТы киваешь. Понимаешь. С ним можно молчать. Это дороже слов.\n\n— Пойдём, — говорит он. — Здесь красиво. Но снаружи есть место, где красивее.',img:null,choices:[{label:'Пойти с ним',target:'g2_04_go'},{label:'Остаться, посмотреть картины',target:'g2_04_stay'}]},
    'g2_03_chair':{text:'Ты садишься на стул. Прожектор греет лицо. Картина кажется живой — два силуэта колышутся, будто дышат.\n\nМакс стоит позади. Его руки ложатся тебе на плечи — легко, как перья.\n\n— Я написал её после одного сна. Проснулся — и знал: это важно. Не знаю почему. Не знаю, кто эти двое. Пока не увидел тебя.\n\nТы прижимаешься спиной к его рукам. Картина смотрит на вас.\n\n— Они похожи на нас, — шепчешь ты.\n\n— Нет, — отвечает он. — Мы похожи на них.',img:null,choices:[{label:'Встать, обернуться к нему',target:'g2_04_turn'},{label:'Попросить отвезти домой',target:'g2_04_home'}]},
    'g2_03_hug':{text:'Ты обнимаешь его сзади. Щёкой касаешься спины — ткань мягкая, под ней — тепло, пульс.\n\nМакс замирает. Потом его руки накрывают твои. Медленно, словно боится, что ты исчезнешь, если пошевелится слишком резко.\n\n— Я не привык, — говорит он тихо. — К тому, что кто-то... остаётся.\n\n— Я здесь, — шепчешь ты. — Сейчас. Этого достаточно?\n\n— Для начала — да. Для всего остального — тоже.\n\nОн поворачивается в твоих объятиях. Лицом к лицу. В полумраке секретного зала картина горит за его спиной.',img:null,choices:[{label:'Поцеловать его',target:'g2_04_kiss'},{label:'Отпустить, улыбнуться',target:'g2_04_smile'}]},
    'g2_04_truth':{text:'- Я тоже хочу настоящего, - говоришь ты. - Устала от масок. От того, что должна быть забавной, легкой, доступной. С тобой не хочу.\n\nМакс смотрит на тебя. Долго. В его глазах - что-то похожее на облегчение.\n\n- Тогда пошли ужинать. Не на свидание. На встречу двух людей, которые устали притворяться.\n\nОн готовит сам. Маленькая квартирка над галереей, плита, которая не работает, и гриль на балконе. Паста с лимоном. Вино из супермаркета.\n\n- Не похоже на романтику, - извиняется он.\n\n- Это и есть романтика. Настоящая.',img:'img/g2-restaurant.jpg',choices:[{label:'Остаться на ночь',target:'g2_05_night'},{label:'Уйти после ужина, но пообещать вернуться',target:'g2_05_promise'}]},
    'g2_04_dinner':{text:'- А есть где поесть поблизости? - спрашиваешь ты. - Я голодна.\n\nМакс смеется - звонко, по-детски.\n\n- Ты у меня в галерее, среди искусства, и думаешь о еде?\n\n- Думаю о том, что искусство - это хорошо. Но паста - лучше.\n\n- Ты мне нравишься все больше, - он берет ключи. - Знаешь ресторан на углу? Где свечи в бутылках и пицца, которую едят руками?\n\n- Знаю. Думала, что только я такая.\n\n- Ты не такая. Ты - единственная такая. Это разные вещи.\n\nОн запирает галерею. Ведет тебя под руку. Улица пустынна, фонари рисуют круги на асфальте.\n\n- Спасибо, что пришла, - говорит он в пустоту. - Я ждал. Давно.',img:'img/g2-restaurant.jpg',choices:[{label:'Сказать, что он того стоил',target:'g2_05_worth'},{label:'Промолчать, прижаться',target:'g2_05_close'}]},
    'g2_04_go':{text:'Ты идешь с ним. Рука в руке. Он ведет через переулки, мимо стен с граффити, мимо закрытых дверей.\n\n- Здесь я пришел в себя после развода, - говорит он у моста. - Стоял два часа и смотрел на воду. Потом пошел и купил первую картину.\n\n- Ты был женат? - спрашиваешь ты. Не из любопытства. Из желания знать.\n\n- Два года. Она ушла, потому что я любил картины сильнее, чем ее. Она была права. Тогда.\n\nОн останавливается. Смотрит на тебя.\n\n- Теперь я научился любить по-другому. Не вместо. Вместе.\n\nРека шумит под мостом. Его глаза - теплые, настоящие.',img:'img/g2-window.jpg',choices:[{label:'Поцеловать его на мосту',target:'g2_05_bridge'},{label:'Сказать, что ты остаешься',target:'g2_05_stay'}]},
    'g2_04_stay':{text:'- Подожди, - говоришь ты. - Хочу еще посмотреть.\n\nМакс кивает. Отступает к двери, наблюдает, как ты идешь между картин.\n\nТы останавливаешься у каждой. Не спешишь. Чувствуешь, как он смотрит - не на картины. На тебя.\n\n- Ты смотришь на них так, будто видишь живых, - говорит он.\n\n- А они не живые? - оборачиваешься ты. - Каждая - чья-то душа. Ты собираешь души, Макс. Это красиво. И немного пугает.\n\n- Пугает?\n\n- Потому что я не хочу быть одной из них. На стене. Красивой и недоступной.\n\nОн подходит. Берет тебя за руку.\n\n- Ты не на стене. Ты здесь. Со мной. Это другое.',img:null,choices:[{label:'Поверить ему',target:'g2_05_trust'},{label:'Уйти, чтобы подумать',target:'g2_05_leave'}]},
    'g2_05_night':{text:'Ночь. Балкон. Город спит внизу, а вы двое - над ним.\n\nМакс накрывает тебя пледом. Вино допито. Паста съедена. Остались только вы - и тишина, в которой не нужно притворяться.\n\n- Ты остаешься? - спрашивает он. Не давит. Просто спрашивает.\n\n- Остаюсь. Не потому что должна. Потому что хочу.\n\nОн улыбается. Той самой улыбкой - тихой, настоящей.\n\n- Это все, что мне нужно. Все, что я хотел.\n\nУтром ты просыпаешься в его рубашке. Запах кофе с балкона. Галерея ждет внизу. Но не сегодня. Сегодня - только вы.',img:'img/g2-morning.jpg',choices:[]},
    'g2_05_promise':{text:'Ты ешь пасту. Он смотрит. Не торопит. Ждет.\n\n- Мне нужно время, - говоришь ты. - Не потому что ты плохой. Потому что я хочу быть уверена. В себе. В нас. Во всем этом.\n\nМакс кивает. Без тени обиды.\n\n- Я подожду. Сколько нужно. Весь вечер. Всю жизнь. Счет не веду.\n\nТы уходишь. Но на пороге оборачиваешься.\n\n- Я вернусь. Это обещание.\n\n- Тогда я буду ждать. Как всегда. Но теперь - зная, что ждать не зря.\n\nТы уходишь по лестнице. А он стоит на балконе и смотрит, пока ты не исчезнешь за поворотом. Как в кино. Но это - настоящее.',img:null,choices:[]},
    'g2_05_worth':{text:'- Ты того стоил, - говоришь ты. - Всего этого ожидания.\n\nОн останавливается. Смотрит на тебя сквозь пар вина.\n\n- Никто так не говорил мне. Никто.\n\n- Тогда люди были слепы.\n\nОн смеется. Потом молчит. Потом говорит:\n\n- Знаешь, в чем секрет галерей? Что картины не уходят. Они ждут. Десять лет - и все еще там. Я хочу быть таким. Для тебя.\n\nТы касаешься его руки. Теплой, реальной. Не картиной. Человеком.\n\n- Ты уже такой. Просто не знал.',img:null,choices:[]},
    'g2_05_close':{text:'Ты молчишь. Просто прижимаешься к нему. Плечом к плечу.\n\nМакс чувствует. Не спрашивает. Просто обнимает тебя одной рукой, другой - режет хлеб.\n\n- Это лучший ужин в моей жизни, - говорит он. - И не из-за пасты.\n\nТы киваешь. Понимаешь.\n\n- Мне тоже. Просто... быть. Не играть. Не убегать. Быть.\n\nНочь за окном. Город мерцает. А вы - в маленькой квартирке над галереей, где впервые за долгое время оба - настоящие.\n\nЭто и есть счастье. Не громкое. Тихое. Настоящее.',img:null,choices:[]},
    'g2_05_bridge':{text:'Ты поднимаешься на цыпочках и целуешь его. Прямо на мосту, под фонарем, над рекой.\n\nПоцелуй - как в старом фильме. Но лучше. Потому что настоящий. Потому что не сценарий. Потому что ты - не героиня. Ты - ты.\n\nМакс обнимает тебя. Долго. Река шумит. Мир крутится.\n\n- Я знал, - шепчет он. - Когда ты вошла в галерею. Знал, что все изменится.\n\n- И что изменилось?\n\n- Я перестал быть галереей без посетителей. Ты - мой зритель. Мой единственный.\n\nТы смеешься. Целуешь снова. Река смотрит. Фонари одобряют.',img:null,choices:[]},
    'g2_05_stay':{text:'- Я остаюсь, - говоришь ты. - Не навсегда. Но сейчас. Здесь. С тобой.\n\nМакс кивает. В его глазах - не торжество. Благодарность.\n\n- Для меня это все. \'Сейчас\' - это все, что у меня есть. Все, что я могу дать.\n\n- Мне не нужно больше. Сейчас - достаточно.\n\nОн берет тебя за руку. Ведет обратно, к галерее. Медленно. Как будто мир может подождать.\n\n- Знаешь, - говорит он по дороге, - я никогда не закрывал галерею ради кого-то. Ты - первая.\n\n- Тогда открой ее завтра. А сегодня - будь моей.\n\n- Сегодня, завтра, и пока ты хочешь.',img:null,choices:[]},
    'g2_05_trust':{text:'- Я верю тебе, - говоришь ты. - Не знаю почему. Просто верю.\n\nМакс закрывает глаза. На мгновение. Как будто молится.\n\n- Спасибо. За веру. За приход. За то, что не ушла, когда могла.\n\nТы стоишь среди его картин. Среди его миров. И понимаешь: он не собирает искусство. Он собирает моменты, в которых не был одинок. И сейчас - такой момент.\n\n- Я рядом, - говоришь ты. - Пока хочешь.\n\n- Хочу. Всегда хочу. Это не поменяется.\n\nТы веришь. И это - начало.',img:null,choices:[]},
    'g2_05_leave':{text:'- Мне нужно подумать, - говоришь ты. - Не о тебе. О себе. О том, что я хочу.\n\nМакс кивает. Улыбается. Грустно, но искренне.\n\n- Думай. Не торопись. Я никуда не денусь. Галерея тут. И я тут.\n\nТы уходишь. Но у двери оборачиваешься.\n\n- Ты особенный, Макс. Просто знай это.\n\n- Я знаю, - усмехнулся он. - Но приятно слышать от тебя.\n\nТы уходишь. Галерея остается за спиной - с ее картинами, его молчаливым взглядом, и обещанием, которое еще не дано. Но может быть.',img:null,choices:[]}
};
let currentScene = 'g2_01';
let sceneHistory = [];
function renderScene(sceneId) {
  const scene = SCENES[sceneId];
  if (!scene) return;
  currentScene = sceneId;
  if(typeof trackScene==="function")trackScene(sceneId);
  sceneHistory.push(sceneId);
  const app = document.getElementById('app');
  let html = '<div class="fade-in">';
  if (scene.img) {
    html += '<img class="scene-img" src="' + scene.img + '" alt="" onload="this.classList.add(\'loaded\')">';
  }
  html += '<div class="scene-text">' + scene.text.replace(/\n/g, '<br>') + '</div>';
  if (scene.choices.length > 0) {
    html += '<div class="choices">';
    scene.choices.forEach(function(c) {
      html += '<button class="choice-btn" onclick="choose(\'' + c.target + '\')">' + c.label + '</button>';
    });
    html += '</div>';
  } else {
    if(typeof trackComplete==='function')trackComplete();
    html += '<div class="end-marker"><p>~ Конец главы ~</p><p style="margin-top:10px;font-size:0.9em">Конец истории</p></div>';
  }
  html += '</div>';
  app.innerHTML = html;
  const maxDepth = 5;
  const progress = Math.min((sceneHistory.length / maxDepth) * 100, 100);
  document.getElementById('progressFill').style.width = progress + '%';
  window.scrollTo({top:0,behavior:'smooth'});
}
