<script>
const SCENES = {
  'g4_01':{text:'Я поднялась по скрипучей лестнице. На пятом этаже Артём оставил дверь приоткрытой.\n\nМастерская пахла льняным маслом, кофе и чем-то ещё — чем-то его. Высокие потолки, панорамные окна, через которые вливался медовый закат. Холсты стояли к стенам, как привидения.\n\nАртём стоял спиной к двери, в белой рубашке с закатанными рукавами. В руке — кисть. На полу — лужицы краски, словно кто-то танцевал по радуге.\n\n— Пришла, — сказал он, не оборачиваясь. — Я чувствовал.\n\nОн повернулся. На его щеке — синяя полоска краски. Глаза горели тем же огнём, что и горизонт за окном.\n\n— Хочешь посмотреть? Или пока просто стоять там, у двери, и дышать?',img:'img/g4_01_studio.jpg',choices:[{label:'Подойти к мольберту',target:'g4_02_molbert'},{label:'Остаться у двери, наблюдать',target:'g4_02_distance'}]},
  'g4_02_molbert':{text:'Я прошла между мольбертами. Под ногами хрустела холстина.\n\nАртём отступил в сторону, давая мне место. На холсте — женский силуэт. Незаконченный. Только линии, тень, намёк на изгиб шеи. Но я узнала себя. В том, как он увидел мои лопатки.\n\n— Это ты, — тихо сказал он. — Но я ещё не решил...\n\nОн замолчал, кисть зависла в воздухе.\n\n— В одежде или без. Честнее — или красивее.\n\nСквозь окно потёк последний луч, и силуэт на холсте вспыхнул золотым.',img:'img/g4_02_molbert.jpg',choices:[{label:'— Решай сам. Честно',target:'g4_03_honest'},{label:'— Нарисуй как есть',target:'g4_03_nude'}]},
  'g4_02_distance':{text:'Я осталась у двери. Руки сами нашли карман пальто.\n\nАртём повернулся ко мне лицом. Кисть в его руке покоилась, капля краски упала на пол — тихий, влажный звук.\n\n— Ты мешаешь моим мыслям, — сказал он, и в голосе не было жалобы. — Стоишь там, в полумраке, и я уже знаю, как падает свет на твои скулы. Но не вижу. Хочу видеть.\n\nОн сделал шаг ко мне. Потом остановился.\n\n— Подойди. Или уйди. Но не стой на пороге — это мучительно.',img:null,choices:[{label:'Подойти к нему',target:'g4_02_molbert'},{label:'Тихо уйти',target:'g4_leave_silent'}]},
  'g4_leave_silent':{text:'Я медленно отступила к лестнице. Моя тень скользнула по стене, коснулась его — и исчезла.\n\nАртём не остановил. Он просто стоял у мольберта, смотрел на дверь, пока я не скрылась.\n\nНо через неделю я увидела свою фотографию в инстаграме художников — «Неизвестная у двери». Он написал меня из памяти. Полуночный профиль, пальто, сумерки.\n\nИногда мне кажется, что я сделала ошибку.\n\nНо ошибки — тоже искусство.',img:null,choices:[]},
  'g4_03_honest':{text:'— Честно, — повторил он, словно пробуя вкус слова.\n\nОн взял другую кисть — тонкую, серебристую. Начал с плеча. Медленно, словно врач, словно священник. Каждый мазок был решением, каждая линия — вопросом.\n\nЯ стояла неподвижно. Через сорок минут он отошёл от холста.\n\n— Готово. Вот такая ты — в ткани, в тени, в загадке.\n\nНа картине я была прекрасна. Но чужая. Как портрет в чужом доме.\n\n— Платье скрывает правду, — сказал он тихо. — Но ты реши: мне нужна правда?',img:null,choices:[{label:'Снять платье',target:'g4_04_undress'},{label:'Попросить его приблизиться',target:'g4_04_closer'}]},
  'g4_03_nude':{text:'Я не отвечала. Просто расстегнула пуговицу за пуговицей. Платье упало на пол — тихо, как вздох.\n\nАртём замер. Кисть в его руке дрогнула. Он смотрел не как художник — как мужчина, который впервые видит то, о чём мечтал.\n\n— Повернись, — прошептал он. — К окну.\n\nЯ повернулась. Закатное солнце облило меня золотом. Я чувствовала его взгляд на своей спине, на бёдрах, на линии шеи. Это было сильнее прикосновения.\n\nЯ услышала звук кисти по холсту. Он работал быстро, почти яростно.',img:'img/g4_03_nude.jpg',choices:[{label:'Позировать неподвижно',target:'g4_05_static'},{label:'Двигаться под музыку',target:'g4_05_music'}]},
  'g4_04_closer':{text:'— Подойди, — сказала я.\n\nАртём отложил кисть. Подошёл так близко, что я чувствовала тепло его тела. Его руки были в краске — синей, охристой, золотой.\n\n— Я не могу коснуться тебя этими руками, — сказал он. — Они испачкают.\n\n— Пусть испачкают, — ответила я.\n\nОн коснулся моей щеки. Пальцы, пахнущие льняным маслом, оставили золотой след. Потом шею. Потом — ключицу. Каждое прикосновение было мазком на моей коже.\n\n— Так лучше, — сказал он. — Живое всегда лучше.',img:null,choices:[{label:'Поцеловать его',target:'g4_06_kiss'},{label:'Опустить глаза',target:'g4_06_eyes'}]},
  'g4_04_undress':{text:'Я достала молнию. Платье соскользнуло — тихо, как вода с лепестка.\n\nАртём положил кисть. Его взгляд был тяжёлым, горячим. Не похожим на художника — похожим на голодного человека, которому только что показали еду после долгого поста.\n\n— Ты уверена? — голос дрожал.\n\nЯ не ответила. Просто встала у окна, как он просил в прошлый раз. Закат обжигал кожу.\n\nОн взял кисть. Но не подошёл к холсту. Подошёл ко мне.\n\n— Тогда я буду рисовать по-другому.',img:null,choices:[{label:'Стоять смирно',target:'g4_05_static'},{label:'Двигаться под музыку',target:'g4_05_music'}]},
  'g4_05_static':{text:'Я замерла. Закат двигался по моей коже — золотой, медовый, горячий.\n\nАртём работал медленно. Каждый мазок был как прикосновение, которого я не чувствовала физически, но ощущала всем телом. Он рисовал мою линию плеча, изгиб бедра, тень под ключицей.\n\nЧас прошёл, может, два. Свет сменился на индиго.\n\n— Готово, — наконец сказал он.\n\nЯ подошла к холсту. На нём была я — но не фотография, не копия. Это было то, как он меня видел. Сильную. Обнажённую. Светлую.\n\n— Оставь её здесь, — прошептал он у моего уха. — Или останься с ней.',img:'img/g4_03_nude.jpg',choices:[{label:'Остаться на ночь',target:'g4_night_stay'},{label:'Уйти, оставив картину',target:'g4_leave_paint'}]},
  'g4_05_music':{text:'— Поставь музыку, — сказала я.\n\nОн достал виниловую пластинку. Медленный джаз, который звучит как прелюдия.\n\nЯ начала двигаться. Не танец — скорее дыхание телом. Руки вверх, спина изгибается, бёдра в такт. Я чувствовала его взгляд на себе, как физическую силу.\n\nАртём рисовал быстро, лихо, ловя движение. Кисть скрипела по холсту. Он смеялся — тихо, от счастья.\n\n— Ты сгораешь, — сказал он. — Я не успеваю.\n\nЯ подошла к нему. Взяла его руку с кистью. Прижала к своей груди.\n\n— Тогда не рисуй. Почувствуй.',img:'img/g4_05_music.jpg',choices:[{label:'Стереть холст и начать сначала',target:'g4_erase'},{label:'Сохранить и продолжить',target:'g4_continue'}]},
  'g4_06_kiss':{text:'Я подняла лицо. Его губы пахли льняным маслом и красным вином.\n\nПоцелуй был медленным, как первый мазок на чистом холсте. Он не торопил. Его руки, в краске, оставляли на мне следы — золотые, синие, охристые. Я становилась его картиной.\n\nОн подхватил меня за талию, усадил на масляный стол. Холодная поверхность к моей коже — и его горячие руки. Контраст, от которого кружилась голова.\n\n— Ты вся в краске, — прошептал он в мою шею.\n\n— Тогда сотри всё и начни заново.',img:'img/g4_02_molbert.jpg',choices:[{label:'Отдаться полностью',target:'g4_full'},{label:'Остановить',target:'g4_stop'}]},
  'g4_06_eyes':{text:'Я опустила глаза. Его пальцы всё ещё были на моей щеке, но легче, словно перышко.\n\n— Ты боишься, — сказал он. Не вопрос.\n\n— Я не знаю, чего хочу, — ответила я честно.\n\nОн отступил. Взял новый холст. Поставил его на мольберт рядом со мной.\n\n— Тогда мы нарисуем вместе. Ты — линии. Я — цвет. Решай, что между.\n\nОн дал мне кисть. Его рука на моей руке. Вместе мы сделали первый мазок — медленный, неровный, наш.',img:null,choices:[{label:'Рисовать вместе до утра',target:'g4_dawn_paint'},{label:'Отложить кисть и обнять его',target:'g4_hug'}]},
  'g4_full':{text:'Он не стёр. Он поднял меня со стола, и краски на его руках оставили следы на моих бёдрах, на животе, на груди. Я стала его полотном.\n\nМы занимались любовью на полу мастерской, среди тюбиков и кистей. Льняное масло пахло как благовония. Его руки были грубы от работы, но нежны от желания.\n\nКраски смешивались с потом. Синий и охра на моей коже. Золото в моих волосах.\n\nПосле, когда мы лежали на холодном полу, он смотрел на меня как на чудо.\n\n— Теперь я знаю каждый изгиб, — сказал он. — Не нужен холст.\n\nНо утром я проснулась одна. На мольберте — новая картина. Мы вместе, сплетённые, из краски и света.\n\nОн оставил записку: «Приходи, когда захочешь стать искусством снова».',img:'img/g4_05_music.jpg',choices:[]},
  'g4_stop':{text:'Я положила руку ему на грудь. Тихо. Не оттолкнула — просто дала понять: стоп.\n\nАртём замер. Его дыхание было тяжёлым, глаза — тёмными. Но он кивнул.\n\n— Понимаю, — сказал он. — Искусство нельзя спешить.\n\nОн отошёл к окну. Взял два бокала, налил вина. Дал мне один. Мы сидели на подоконнике, ноги свисали в темноту, и смотрели, как город гаснет.\n\n— Вернёшься? — спросил он, когда я собрала пальто.\n\nЯ посмотрела на недописанный холст. На моё обнажённое отражение в нём.\n\n— Когда захочу быть правдой, — ответила я. — А не картинкой.',img:'img/g4_01_studio.jpg',choices:[]},
  'g4_erase':{text:'Я взяла шпатель со стола. Одним движением провела по холсту — белая полоса разрезала меня пополам.\n\nАртём ахнул. Потом рассмеялся — звонко, свободно.\n\n— Начнём заново, — сказала я. — Только ты и я. Чистый лист.\n\nОн подошёл вплотную. Его губы коснулись моих — вкус масла и вина. Потом опустились ниже. На шею. На ключицу. На грудь.\n\nМы делали любовь на чистом холсте, который лежал на полу. Краски размазывались под моей спиной — синий, охристый, алый. Я оставила на нём отпечаток своего тела.\n\nУтром он повесил этот холст на стену.\n\n— Лучшая картина, которую я не рисовал, — сказал он.',img:'img/g4_05_music.jpg',choices:[]},
  'g4_continue':{text:'— Сохрани, — сказала я. — Это важно.\n\nОн осторожно снял холст с мольберта. Положил на сушилку.\n\n— Завтра я продолжу, — сказал он. — Но тебе нужно прийти. Без тебя — это просто краски.\n\nОн проводил меня до двери. На пороге обнял — не поцеловал, именно обнял. Крепко, словно прощаясь надолго.\n\n— Я приду, — сказала я.\n\nИ пришла. Через день. Через неделю. Через месяц.\n\nКартина так и осталась недописанной. Потому что жизнь оказалась интереснее холста.',img:'img/g4_01_studio.jpg',choices:[]},
  'g4_night_stay':{text:'Я не ушла. Мы открыли бутылку вина, сели на пол среди холстов и говорили до утра.\n\nОн рассказывал о Париже, о Берлине, о художниках, которые умирают голодными. Я рассказывала о своих страхах, о работе, о том, что никогда не говорила никому.\n\nНочью он накрыл меня своей рубашкой. Утром я проснулась в его объятиях — не любовником, а пристанью.\n\n— Останься на завтрак, — прошептал он.\n\n— Останусь. И на обед. И может — навсегда.\n\nОн улыбнулся. Закат в его глазах сменился рассветом.',img:'img/g4_05_music.jpg',choices:[]},
  'g4_leave_paint':{text:'Я оделась. Посмотрела на картину в последний раз.\n\n— Оставь её мне? — попросила я.\n\n— Нет, — покачал он головой. — Она твоя. Но останется здесь. Приходи смотреть.\n\nЯ поняла: он оставляет меня в своей жизни, даже когда я ухожу. Это был его способ держать.\n\nЯ вышла на лестницу. Закат уже умер, за окнами — индиго ночи.\n\nНо я знала: где-то там, в мастерской, я всё ещё стою у окна. Обнажённая. Светлая. Вечная.\n\nИногда искусство — это способ быть рядом, даже на расстоянии.',img:'img/g4_01_studio.jpg',choices:[]},
  'g4_dawn_paint':{text:'Мы рисовали всю ночь. Он учил меня смешивать цвета, я учила его — останавливаться вовремя.\n\nНа холсте получилась абстракция: синие линии моей руки, золотые пятна его пальцев, и в центре — белое пространство, куда мы оба боялись зайти.\n\nРассвет застал нас за работой. Свет изменил всё — картина ожила.\n\n— Это мы, — сказал он. — Не законченные. Но вместе.\n\nЯ положила голову ему на плечо. Его рубашка пахла маслом и мной.\n\n— Давай никогда не заканчивать, — прошептала я.\n\n— Художники редко заканчивают, — усмехнулся он. — Мы просто останавливаемся.',img:'img/g4_02_molbert.jpg',choices:[]},
  'g4_hug':{text:'Я отложила кисть. Обняла его.\n\nОн замер — художник, привыкший быть один. Потом его руки обвили меня, прижали к себе, словно я была последним светом в темной комнате.\n\nМы стояли так долго. Краски высохли на наших пальцах. Музыка кончилась. Закат умер.\n\n— Я боюсь, — прошептал он в мои волосы. — Что нарисую тебя и потеряю.\n\n— Тогда не рисуй, — ответила я. — Просто будь.\n\nТой ночью мы не спали. Не занимались любовью. Мы просто лежали на полу мастерской, смотрели в потолок, и дышали в унисон.\n\nИногда близость — это не прикосновение. Это присутствие.',img:'img/g4_05_music.jpg',choices:[]}
};

let currentScene = 'g4_01';
let sceneHistory = [];

function renderScene(sceneId) {
  const scene = SCENES[sceneId];
  if (!scene) return;
  currentScene = sceneId;
  sceneHistory.push(sceneId);

  const app = document.getElementById('app');
  let html = '<div class="fade-in">';

  if (scene.img) {
    html += '<img class="scene-img" src="' + scene.img + '" alt="" onload="this.classList.add(\'loaded\')">';
  }

  html += '<div class="scene-text">' + scene.text.replace(/\n/g, '<br>') + '</div>';

  if (scene.choices.length > 0) {
    html += '<div class="choices">';
    scene.choices.forEach(function(c) {
      html += '<button class="choice-btn" onclick="choose(\'' + c.target + '\')">' + c.label + '</button>';
    });
    html += '</div>';
  } else {
    html += '<div class="end-marker"><p>~ Конец главы ~</p><p style="margin-top:10px;font-size:0.9em">Глава 4 — Мастерская Артёма</p></div>';
  }

  html += '</div>';
  app.innerHTML = html;

  // Progress
  const maxDepth = 6;
  const progress = Math.min((sceneHistory.length / maxDepth) * 100, 100);
  document.getElementById('progressFill').style.width = progress + '%';

  window.scrollTo({top:0,behavior:'smooth'});
}

function choose(targetId) {
  renderScene(targetId);
}

// Start
renderScene('g4_01');
</script>
</body>
</html>
