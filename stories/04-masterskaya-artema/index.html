<script>
const SCENES = {
    'g4_01':{text:'Ты поднимаешься по скрипучей лестнице. На пятом этаже Артём оставил дверь приоткрытой.\n\nМастерская пахнет льняным маслом, кофе и чем-то еще - чем-то его. Высокие потолки, панорамные окна, через которые вливается медовый закат. Холсты стоят к стенам, как привидения.\n\nАртём стоит спиной к двери, в белой рубашке с закатанными рукавами. В руке - кисть. На полу - лужицы краски, словно кто-то танцевал по радуге.\n\n- Пришла, - говорит он, не оборачиваясь. - Я чувствовал.\n\nОн поворачивается. На его щеке - синяя полоска краски. Глаза горят тем же огнем, что и горизонт за окном.\n\n- Хочешь посмотреть? Или пока просто стоять там, у двери, и дышать?',img:'img/g4_01_studio.jpg',choices:[{label:'Подойти к мольберту',target:'g4_02_molbert'},{label:'Остаться у двери, наблюдать',target:'g4_02_distance'}]},
    'g4_02_molbert':{text:'Ты проходишь между мольбертами. Под ногами хрустит холстина.\n\nАртём отступает в сторону, давая тебе место. На холсте - женский силуэт. Незаконченный. Только линии, тень, намек на изгиб шеи. Но ты узнаешь себя. В том, как он увидел твои лопатки.\n\n- Это ты, - тихо говорит он. - Но я еще не решил...\n\nОн замолкает, кисть зависает в воздухе.\n\n- В одежде или без. Честнее - или красивее.\n\nСквозь окно потек последний луч, и силуэт на холсте вспыхнул золотым.',img:'img/g4_02_molbert.jpg',choices:[{label:'- Решай сам. Честно',target:'g4_03_honest'},{label:'- Нарисуй как есть',target:'g4_03_nude'}]},
    'g4_02_distance':{text:'Ты остаешься у двери. Руки сами находят карман пальто.\n\nАртём поворачивается к тебе лицом. Кисть в его руке покоится, капля краски падает на пол - тихий, влажный звук.\n\n- Ты мешаешь моим мыслям, - говорит он, и в голосе нет жалобы. - Стоишь там, в полумраке, и я уже знаю, как падает свет на твои скулы. Но не вижу. Хочу видеть.\n\nОн делает шаг к тебе. Потом останавливается.\n\n- Подойди. Или уйди. Но не стой на пороге - это мучительно.',img:null,choices:[{label:'Подойти к нему',target:'g4_02_molbert'},{label:'Тихо уйти',target:'g4_leave_silent'}]},
    'g4_leave_silent':{text:'Ты медленно отступаешь к лестнице. Твоя тень скользит по стене, касается его - и исчезает.\n\nАртём не останавливает. Он просто стоит у мольберта, смотрит на дверь, пока ты не скрываешься.\n\nНо через неделю ты видишь свою фотографию в инстаграме художников - \'Неизвестная у двери\'. Он написал тебя из памяти. Полуночный профиль, пальто, сумерки.\n\nИногда тебе кажется, что ты совершила ошибку.\n\nНо ошибки - тоже искусство.',img:null,choices:[]},
    'g4_03_honest':{text:'- Честно, - повторяет он, словно пробуя вкус слова.\n\nОн берет другую кисть - тонкую, серебристую. Начинает с плеча. Медленно, словно врач, словно священник. Каждый мазок - решение, каждая линия - вопрос.\n\nТы стоишь неподвижно. Через сорок минут он отходит от холста.\n\n- Готово. Вот такая ты - в ткани, в тени, в загадке.\n\nНа картине ты прекрасна. Но чужая. Как портрет в чужом доме.\n\n- Платье скрывает правду, - говорит он тихо. - Но ты реши: мне нужна правда?',img:null,choices:[{label:'Снять платье',target:'g4_04_undress'},{label:'Попросить его приблизиться',target:'g4_04_closer'}]},
    'g4_03_nude':{text:'Ты не отвечаешь. Просто расстегиваешь пуговицу за пуговицей. Платье падает на пол - тихо, как вздох.\n\nАртём замирает. Кисть в его руке дрогнула. Он смотрит не как художник - как мужчина, который впервые видит то, о чем мечтал.\n\n- Повернись, - шепчет он. - К окну.\n\nТы поворачиваешься. Закатное солнце обливает тебя золотом. Ты чувствуешь его взгляд на своей спине, на бедрах, на линии шеи. Это сильнее прикосновения.\n\nТы слышишь звук кисти по холсту. Он работает быстро, почти яростно.',img:'img/g4_03_nude.jpg',choices:[{label:'Позировать неподвижно',target:'g4_05_static'},{label:'Двигаться под музыку',target:'g4_05_music'}]},
    'g4_04_closer':{text:'- Подойди, - говоришь ты.\n\nАртём откладывает кисть. Подходит так близко, что ты чувствуешь тепло его тела. Его руки в краске - синей, охристой, золотой.\n\n- Я не могу коснуться тебя этими руками, - говорит он. - Они испачкают.\n\n- Пусть испачкают, - отвечаешь ты.\n\nОн касается твоей щеки. Пальцы, пахнущие льняным маслом, оставляют золотой след. Потом шею. Потом - ключицу. Каждое прикосновение - мазок на твоей коже.\n\n- Так лучше, - говорит он. - Живое всегда лучше.',img:null,choices:[{label:'Поцеловать его',target:'g4_06_kiss'},{label:'Опустить глаза',target:'g4_06_eyes'}]},
    'g4_04_undress':{text:'Ты достаешь молнию. Платье соскальзывает - тихо, как вода с лепестка.\n\nАртём кладет кисть. Его взгляд тяжелый, горячий. Не похожий на художника - похожий на голодного человека, которому только что показали еду после долгого поста.\n\n- Ты уверена? - голос дрожит.\n\nТы не отвечаешь. Просто встаешь у окна, как он просил в прошлый раз. Закат обжигает кожу.\n\nОн берет кисть. Но не подходит к холсту. Подходит к тебе.\n\n- Тогда я буду рисовать по-другому.',img:null,choices:[{label:'Стоять смирно',target:'g4_05_static'},{label:'Двигаться под музыку',target:'g4_05_music'}]},
    'g4_05_static':{text:'Ты замираешь. Закат движется по твоей коже - золотой, медовый, горячий.\n\nАртём работает медленно. Каждый мазок - как прикосновение, которого ты не чувствуешь физически, но ощущаешь всем телом. Он рисует линию твоего плеча, изгиб бедра, тень под ключицей.\n\nЧас прошел, может, два. Свет сменился на индиго.\n\n- Готово, - наконец говорит он.\n\nТы подходишь к холсту. На нем - ты. Но не фотография, не копия. Это то, как он тебя видел. Сильную. Обнаженную. Светлую.\n\n- Оставь ее здесь, - шепчет он у твоего уха. - Или останься с ней.',img:'img/g4_03_nude.jpg',choices:[{label:'Остаться на ночь',target:'g4_night_stay'},{label:'Уйти, оставив картину',target:'g4_leave_paint'}]},
    'g4_05_music':{text:'- Поставь музыку, - говоришь ты.\n\nОн достает виниловую пластинку. Медленный джаз, который звучит как прелюдия.\n\nТы начинаешь двигаться. Не танец - скорее дыхание телом. Руки вверх, спина изгибается, бедра в такт. Ты чувствуешь его взгляд на себе, как физическую силу.\n\nАртём рисует быстро, лихо, ловя движение. Кисть скрипит по холсту. Он смеется - тихо, от счастья.\n\n- Ты сгораешь, - говорит он. - Я не успеваю.\n\nТы подходишь к нему. Берешь его руку с кистью. Прижимаешь к своей груди.\n\n- Тогда не рисуй. Почувствуй.',img:'img/g4_05_music.jpg',choices:[{label:'Стереть холст и начать сначала',target:'g4_erase'},{label:'Сохранить и продолжить',target:'g4_continue'}]},
    'g4_06_kiss':{text:'Ты поднимаешь лицо. Его губы пахнут льняным маслом и красным вином.\n\nПоцелуй медленный, как первый мазок на чистом холсте. Он не торопит. Его руки, в краске, оставляют на тебе следы - золотые, синие, охристые. Ты становишься его картиной.\n\nОн подхватывает тебя за талию, усаживает на масляный стол. Холодная поверхность к твоей коже - и его горячие руки. Контраст, от которого кружится голова.\n\n- Ты вся в краске, - шепчет он в твою шею.\n\n- Тогда сотри все и начни заново.',img:null,choices:[{label:'Отдаться полностью',target:'g4_full'},{label:'Остановить',target:'g4_stop'}]},
    'g4_06_eyes':{text:'Ты опускаешь глаза. Его пальцы все еще на твоей щеке, но легче, словно перышко.\n\n- Ты боишься, - говорит он. Не вопрос.\n\n- Я не знаю, чего хочу, - отвечаешь ты честно.\n\nОн отступает. Берет новый холст. Ставит его на мольберт рядом с тобой.\n\n- Тогда мы нарисуем вместе. Ты - линии. Я - цвет. Решай, что между.\n\nОн дает тебе кисть. Его рука на твоей руке. Вместе вы делаете первый мазок - медленный, неровный, ваш.',img:null,choices:[{label:'Рисовать вместе до утра',target:'g4_dawn_paint'},{label:'Отложить кисть и обнять его',target:'g4_hug'}]},
    'g4_full':{text:'Он не стирает. Он поднимает тебя со стола, и краски на его руках оставляют следы на твоих бедрах, на животе, на груди. Ты становишься его полотном.\n\nВы занимаетесь любовью на полу мастерской, среди тюбиков и кистей. Льняное масло пахнет как благовония. Его руки грубы от работы, но нежны от желания.\n\nКраски смешиваются с потом. Синий и охра на твоей коже. Золото в твоих волосах.\n\nПосле, когда вы лежите на холодном полу, он смотрит на тебя как на чудо.\n\n- Теперь я знаю каждый изгиб, - говорит он. - Не нужен холст.\n\nНо утром ты просыпаешься одна. На мольберте - новая картина. Вы вместе, сплетенные, из краски и света.\n\nОн оставил записку: \'Приходи, когда захочешь стать искусством снова\'.',img:'img/g4_05_music.jpg',choices:[]},
    'g4_stop':{text:'Ты кладешь руку ему на грудь. Тихо. Не отталкиваешь - просто даешь понять: стоп.\n\nАртём замирает. Его дыхание тяжелое, глаза - темные. Но он кивает.\n\n- Понимаю, - говорит он. - Искусство нельзя спешить.\n\nОн отходит к окну. Берет два бокала, наливает вина. Дает тебе один. Вы сидите на подоконнике, ноги свисают в темноту, и смотрите, как город гаснет.\n\n- Вернёшься? - спрашивает он, когда ты собираешь пальто.\n\nТы смотришь на недописанный холст. На свое обнаженное отражение в нем.\n\n- Когда захочу быть правдой, - отвечаешь ты. - А не картинкой.',img:'img/g4_01_studio.jpg',choices:[]},
    'g4_erase':{text:'Ты берешь шпатель со стола. Одним движением проводишь по холсту - белая полоса разрезает тебя пополам.\n\nАртём ахает. Потом смеется - звонко, свободно.\n\n- Начнем заново, - говоришь ты. - Только ты и я. Чистый лист.\n\nОн подходит вплотную. Его губы касаются твоих - вкус масла и вина. Потом опускаются ниже. На шею. На ключицу. На грудь.\n\nВы занимаетесь любовью на чистом холсте, который лежит на полу. Краски размазываются под твоей спиной - синий, охристый, алый. Ты оставляешь на нем отпечаток своего тела.\n\nУтром он вешает этот холст на стену.\n\n- Лучшая картина, которую я не рисовал, - говорит он.',img:'img/g4_05_music.jpg',choices:[]},
    'g4_continue':{text:'- Сохрани, - говоришь ты. - Это важно.\n\nОн осторожно снимает холст с мольберта. Кладет на сушилку.\n\n- Завтра я продолжу, - говорит он. - Но тебе нужно прийти. Без тебя - это просто краски.\n\nОн провожает тебя до двери. На пороге обнимает - не целует, именно обнимает. Крепко, словно прощаясь надолго.\n\n- Я приду, - говоришь ты.\n\nИ приходишь. Через день. Через неделю. Через месяц.\n\nКартина так и остается недописанной. Потому что жизнь оказывается интереснее холста.',img:'img/g4_01_studio.jpg',choices:[]},
    'g4_night_stay':{text:'Ты не уходишь. Вы открываете бутылку вина, садитесь на пол среди холстов и говорите до утра.\n\nОн рассказывает о Париже, о Берлине, о художниках, которые умирают голодными. Ты рассказываешь о своих страхах, о работе, о том, что никогда не говорила никому.\n\nНочью он накрывает тебя своей рубашкой. Утром ты просыпаешься в его объятиях - не любовником, а пристанью.\n\n- Останься на завтрак, - шепчет он.\n\n- Останусь. И на обед. И может - навсегда.\n\nОн улыбается. Закат в его глазах сменился рассветом.',img:'img/g4_05_music.jpg',choices:[]},
    'g4_leave_paint':{text:'Ты одеваешься. Смотришь на картину в последний раз.\n\n- Оставь ее мне? - просишь ты.\n\n- Нет, - качает он головой. - Она твоя. Но останется здесь. Приходи смотреть.\n\nТы понимаешь: он оставляет тебя в своей жизни, даже когда ты уходишь. Это был его способ держать.\n\nТы выходишь на лестницу. Закат уже умер, за окнами - индиго ночи.\n\nНо ты знаешь: где-то там, в мастерской, ты все еще стоишь у окна. Обнаженная. Светлая. Вечная.\n\nИногда искусство - это способ быть рядом, даже на расстоянии.',img:'img/g4_01_studio.jpg',choices:[]},
    'g4_dawn_paint':{text:'Вы рисуете всю ночь. Он учит тебя смешивать цвета, ты учишь его - останавливаться вовремя.\n\nНа холсте получается абстракция: синие линии твоей руки, золотые пятна его пальцев, и в центре - белое пространство, куда вы оба боитесь зайти.\n\nРассвет застает вас за работой. Свет меняет все - картина оживает.\n\n- Это мы, - говорит он. - Не законченные. Но вместе.\n\nТы кладешь голову ему на плечо. Его рубашка пахнет маслом и тобой.\n\n- Давай никогда не заканчивать, - шепчешь ты.\n\n- Художники редко заканчивают, - усмехается он. - Мы просто останавливаемся.',img:'img/g4_02_molbert.jpg',choices:[]},
    'g4_hug':{text:'Ты откладываешь кисть. Обнимаешь его.\n\nОн замирает - художник, привыкший быть один. Потом его руки обвивают тебя, прижимают к себе, словно ты - последний свет в темной комнате.\n\nВы стоите так долго. Краски сохнут на ваших пальцах. Музыка кончается. Закат умирает.\n\n- Я боюсь, - шепчет он в твои волосы. - Что нарисую тебя и потеряю.\n\n- Тогда не рисуй, - отвечаешь ты. - Просто будь.\n\nТой ночью вы не спите. Не занимаетесь любовью. Вы просто лежите на полу мастерской, смотрите в потолок, и дышите в унисон.\n\nИногда близость - это не прикосновение. Это присутствие.',img:'img/g4_05_music.jpg',choices:[]}
};
let currentScene = 'g4_01';
let sceneHistory = [];
function renderScene(sceneId) {
  const scene = SCENES[sceneId];
  if (!scene) return;
  currentScene = sceneId;
  if(typeof trackScene==="function")trackScene(sceneId);
  sceneHistory.push(sceneId);
  const app = document.getElementById('app');
  let html = '<div class="fade-in">';
  if (scene.img) {
    html += '<img class="scene-img" src="' + scene.img + '" alt="" onload="this.classList.add(\'loaded\')">';
  }
  html += '<div class="scene-text">' + scene.text.replace(/\n/g, '<br>') + '</div>';
  if (scene.choices.length > 0) {
    html += '<div class="choices">';
    scene.choices.forEach(function(c) {
      html += '<button class="choice-btn" onclick="choose(\'' + c.target + '\')">' + c.label + '</button>';
    });
    html += '</div>';
  } else {
    if(typeof trackComplete==='function')trackComplete();
    html += '<div class="end-marker"><p>~ Конец главы ~</p><p style="margin-top:10px;font-size:0.9em">Конец истории</p></div>';
  }
  html += '</div>';
  app.innerHTML = html;
  const maxDepth = 6;
  const progress = Math.min((sceneHistory.length / maxDepth) * 100, 100);
  document.getElementById('progressFill').style.width = progress + '%';
  window.scrollTo({top:0,behavior:'smooth'});
}
function choose(targetId) { renderScene(targetId); }
renderScene(currentScene);
</script>
<script src="../analytics.js"></script>
</body>
