<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Бонус — Шибари</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#1a0f0a;color:#f5ede4;min-height:100vh;padding:20px}
.container{max-width:680px;margin:0 auto;padding-bottom:60px}
.scene-img{width:100%;height:240px;object-fit:cover;border-radius:12px;margin-bottom:16px;box-shadow:0 8px 32px rgba(212,175,137,0.15)}
.scene-text{font-size:17px;line-height:1.75;margin-bottom:20px;white-space:pre-line}
.choices{display:grid;gap:10px;margin-top:16px}
.choice-btn{background:rgba(212,175,137,0.08);border:2px solid rgba(212,175,137,0.3);color:#d4af89;padding:16px 20px;border-radius:12px;cursor:pointer;font-size:16px;text-align:left;transition:all 0.2s}
.choice-btn:hover{background:rgba(212,175,137,0.18);border-color:#d4af89}
.header{text-align:center;padding:24px 0 16px}
.header h1{font-size:22px;color:#d4af89;font-weight:400}
</style>
</head>
<body>
<div class="container">
<div class="header"><h1>Глава 7 — Шибари</h1></div>
<div id="app"></div>
<div style="text-align:center;margin-top:24px">
  <a href="../../index.html" style="display:inline-block;padding:12px 24px;background:rgba(212,175,137,0.12);border:1px solid rgba(212,175,137,0.3);color:#d4af89;text-decoration:none;border-radius:8px;font-size:15px">← Назад к книге</a>
</div>
</div>
<script>
const IMAGES={
festival:'./img/shibari-festival.jpg',
workshop:'./img/shibari-tea.jpg',
suspension:'./img/shibari-suspension.jpg',
after:'./img/shibari-tea.jpg'
};
const SCENES={
's1_start':{text:'Ты вошла в павильон без названия.\n\nВнутри — тишина, нарушаемая только тихим шелестом бумаги и запахом сандалового дерева. Воздух был другим здесь: плотным, насыщенным, как перед грозой.\n\nВ центре — высокий мужчина в хлопковой рубашке цвета слоновой кости. Он складывал что-то из красной бумаги — тонкими, точными движениями, будто каждый изгиб был молитвой.\n\n— Оригами? — спросила ты.\n\n— Нет, — он поднял глаза. — Прелюдия.\n\nВокруг стояли бамбуковые стойки с верёвками — джутовыми, конопляными, шёлковыми. Не украшение. Инструмент.',img:IMAGES.festival,choices:[{label:'Подойти ближе',target:'s2_workshop'},{label:'Посмотреть на стойки',target:'s2_rope'}]},

's2_rope':{text:'Ты подошла к ближайшей стойке. Верёвки висели аккуратными снопами — каждый узел зафиксирован, каждый конец спрятан.\n\nТы потянулась к джутовой — она была шершавой, тёплой от ладоней.\n\n— Это не для декора, — голос за спиной. Он стоял так близко, что ты почувствовала запах — не парфюм, что-то другое. Масло для верёвок. Хлопок. Собственный запах человека, который работает руками.\n\n— Для чего?\n\n— Для доверия. Когда всё другое обманет — верёвка останется честной. Она либо держит, либо нет.',img:IMAGES.festival,choices:[{label:'Спросить о мастер-классе',target:'s2_workshop'},{label:'Уйти',target:'s2_leave'}]},

's2_leave':{text:'Ты повернулась к выходу. Но в зеркале на стене — случайно, нечаянно — ты увидела себя. Среди бамбука и верёвок, в белом платье, с макияжем, который ещё держался.\n\nТы выглядела... готовой. Не к оригами. К чему-то другому.\n\nОн молчал. Ждал. Он умел ждать — это было в каждой линии его тела, в каждом вздохе.\n\nТы остановилась у порога.\n\n— Расскажите, — сказала ты, не оборачиваясь. — Что вы делаете.',img:IMAGES.festival,choices:[{label:'Вернуться',target:'s2_workshop'}]},

's2_workshop':{text:'Он кивнул — не улыбнулся, не торжествовал. Просто кивнул, как будто знал, что ты вернёшься.\n\n— Вертикальное подвешивание. Шибари. Не то, что показывают в фильмах — не боль ради боли. Эстетика. Контроль. Доверие.\n\nОн взял верёвку с ближайшей стойки. Джут — толщиной с мизинец, золотисто-коричневый.\n\n— Чем больше обмотки — тем меньше боли. Боль — это роскошь, которую мы не используем. Мы используем положение. Напряжение. Мысль о том, что ты не можешь пошевелиться.\n\nОн смотрел тебе в глаза, говоря это. Искал что-то.\n\n— Вы хотели бы попробовать? Групповой урок начинается через десять минут.\n\n— А можно...\n\n— Индивидуально? — он наклонил голову. — Да. Если вы готовы задержаться.',img:IMAGES.workshop,choices:[{label:'Записаться индивидуально',target:'s3_private'},{label:'Подождать групповой',target:'s3_group'}]},

's3_group':{text:'Групповой мастер-класс оказался не тем, что ты ожидала.\n\nДесять девушек в разном возрасте — от двадцати до пятидесяти. Некоторые с мужьями, некоторые одни. Все — с любопытством в глазах, которое не было стыдливым.\n\nОн объяснял, не касаясь никого. Только верёвки и воздух между ними.\n\n— Узел Такаё Кинбаку. Один из старейших. Он держит, но не сдавливает. Дышит вместе с вами.\n\nТы повторяла за ним на подушке — узел развязывался, пока ты не поняла, как именно ложится перехлёст. Потом — вдруг — получилось. И верёвка, которую ты сама связала, сжала запястье — не больно, но настойчиво.\n\n— Ощутите это, — сказал он, глядя на тебя. — Это доверие к себе.\n\nПосле урока он подошёл, когда все уходили.\n\n— У вас получается. Если захотите продолжить — я здесь до вечера.',img:IMAGES.workshop,choices:[{label:'Остаться для индивидуального',target:'s3_private'},{label:'Уйти',target:'s2_leave'}]},

's3_private':{text:'— У меня нет подходящего наряда, — сказала ты, когда все ушли.\n\nОн оглядел тебя — не похотливо, оценивающе, как художник холст.\n\n— Красота тела будет подчёркнута верёвками. Они работают с формой, не скрывают её. Бельё бежевого цвета — в тон коже. В зеркале может показаться, что на вас ничего нет. Это часть эстетики.\n\nТы посмотрела на себя. Комплект действительно был бесшовный — шортики и лифчик, которые носила под платьем. Бежевый, почти незаметный.\n\n— Для вас я достану новый комплект, — сказал он, открывая ящик стола. — Ещё не использовал. Очень мягкие.\n\nТебе было приятно это слышать — какая-то эксклюзивность в том, что ты первая, кто коснётся этой верёвки.\n\nТы улыбнулась.\n\n— Чем больше обмотки...\n\n— ...тем меньше боли, — закончил он. — Не бойтесь.',img:IMAGES.workshop,choices:[{label:'Начать',target:'s4_suspension'}]},

's4_suspension':{text:'Он начал с запястий.\n\n— Не боритесь с верёвкой. Она не враг.\n\nДжут был шершавым, тёплым от его ладоней. Он обматывал медленно — каждый виток ложился ровно, без заломов. Предплечья зафиксированы. Потом — плечи. Ты почувствовала, как верхняя часть тела становится тяжёлей — не потому что верёвки тяжёлые, а потому что ты перестала держать сама.\n\n— Дышите.\n\nОн опустился к бёдрам. Шёлковые трусики-шортики сдвинулись немного — он поправил одним движением, без комментария, как врач. Бёдра были подвешены в разных направлениях — одно выше другого, разворот в тазе, который ты никогда не пробовала.\n\n— Бамбук, — сказал он, подводя тебя к столбу. — Древесина гибкая. Как вы.\n\nРуки зафиксированы за спиной — запястья к запястьям. Голова запрокинута назад. В зеркале на стене ты увидела себя — и перестала дышать на секунду.\n\nВерёвки образовали геометрию на твоём теле — ромбы, треугольники, линии, которые подчёркивали талию, бёдра, линию шеи. Бежевое бельё действительно сливалось с кожей. Казалось, что верёвки держат тело само по себе.\n\n— Великолепно, — прошептал он. Не тебе. Себе.\n\n— Прикусите.\n\nОн положил тонкую верёвку между губ — не давил, просто лежала там, напоминая, что голова тоже зафиксирована. Обмотка вокруг скул — декоративная, символическая, но она меняла всё. Ты не могла говорить. Не хотела.',img:IMAGES.suspension,choices:[{label:'Закрыть глаза',target:'s5_float'},{label:'Смотреть в зеркало',target:'s5_mirror'}]},

's5_mirror':{text:'Ты смотрела в зеркало.\n\nВ нём — ты, но не ты. Та, которая обычно контролирует всё: макияж, позу, слова, впечатление. Эта — запутана в джуте, подвешена в воздухе, с верёвкой между зубами — и выглядела... свободной.\n\nОн стоял позади, в отражении. Хлопковая рубашка намокла между лопатками. Он дышал тяжело — не от возбуждения, от концентрации. От того, что делал это правильно.\n\n— Ваше дыхание, — сказал он тихо. — Учащённое. Если это дискомфорт — скажите. Мигните дважды.\n\nТы не мигнула.\n\nОн подошёл ближе — на расстояние вытянутой руки. Не коснулся.\n\n— Вы здесь по своей воле. Помните это. Это важнее, чем верёвки.',img:IMAGES.suspension,choices:[{label:'Закрыть глаза',target:'s5_float'}]},

's5_float':{text:'Ты закрыла глаза.\n\nИ тут поняла — ты паришь. Не стоишь, не сидишь, не лежишь. Паришь. Верёвки держали всё твое тело, распределяя вес так, чтобы ни одна точка не кричала. Было странно, было ново — и было возбуждающе.\n\nНе физически. Хуже. В голове.\n\nТы ничего не контролировала. Не могла пошевелить руками, ногами, головой. Могла только дышать — и то, чуть глубже обычного.\n\nА если он решит...\n\nМысль пришла сама, без приглашения. Не страх. Напряжение. Ты ничего не сможешь сделать. Не сможешь оттолкнуть, не сможешь развернуться, не сможешь сказать "нет".\n\nМысль пульсировала между ног — не прикосновение, просто мысль. Ты сжала бёдра, но верёвки не позволили. Ты запрокинула голову ещё сильнее — и верёвка между зубами напомнила, что рот тоже занят.\n\nОт него пахло — маслами для джута, хлопковой рубашкой, потом. Не спортивный пот. Пот работы. Концентрации.\n\nТы услышала, как он отошёл на два шага. Затих. Открыла глаза — он сидел на ковре, скрестив ноги, и смотрел на тебя.\n\nПросто смотрел.\n\nБез слов. Без движения. Просто — любовался тем, что создал.',img:IMAGES.suspension,choices:[{label:'Ждать',target:'s6_descent'}]},

's6_descent':{text:'Так прошло несколько минут.\n\nТы в подвешенном состоянии — физически и ментально. Он на ковре — тихий, неподвижный, как статуя Будды, только с мокрой рубашкой и тяжёлым дыханием.\n\nПотом он встал. Подошёл. И начал развязывать — в обратном порядке, быстро, но бережно. Каждый узел, который он завязывал минуту, развязывался за секунду. Ты почувствовала, как вес возвращается в тело — ноги, руки, шея.\n\nПоследняя петля — на запястье. Он ослабил её пальцами, подержал твою руку в своей на секунду дольше, чем нужно.\n\nПотом опустил тебя на ковёр. Мягко — не уронил, опустил, как ребёнка в кроватку. Ковёр был глубоким, пушистым, пах шерстью и чем-то сладким — может, лавандой, может, ванилью.\n\nОн снял последние петли. Потом — лёг рядом и прижал к себе.\n\nТело его было горячим, твёрдым от мышц, а рубашка — всё ещё влажной. Он не говорил. Просто держал — так крепко, что ты почувствовала своё сердбце, отбивающееся о его рёбра.\n\nМинуту. Две.\n\n— Спасибо, — сказал он в твои волосы. — За доверие.',img:IMAGES.after,choices:[{label:'Остаться на чай',target:'s7_tea'},{label:'Уйти',target:'s7_leave'}]},

's7_leave':{text:'Ты встала. Ноги дрожали — не от боли, от напряжения мышц, которые работали по-другому. Он протянул руку, подержал локоть, пока ты не устояла.\n\n— Одевайтесь медленно. Кровь перераспределяется.\n\nТы надела платье поверх бежевого белья. Он помог с молнией — одним движением, как всё, что он делал.\n\n— Верёвки...\n\n— Останутся здесь. На память — только ощущение.\n\nТы ушла в толпу фестиваля. Люди несли оригами журавлей, пили саке, смеялись.\n\nТы шла молча. С ощущением, которое не передать словами. С мыслью, которая не укладывалась в рамки привычного.\n\nИ с желанием вернуться.',img:null,choices:[]},

's7_tea':{text:'— Я скручу верёвки, — сказал он. — И накоплю чайник. Десять минут.\n\nТы села на ковёр, у стены. Наблюдала, как он работает — быстро, ритмично, каждое движение отточено годами. Верёвки складывались в снопы, узлы проверялись, концы заправлялись. Он не спешил, но и не медлил — просто знал, сколько времени занимает каждый шаг.\n\nЧайник закипел. Звук — противоположность тишине, которая была минуту назад.\n\nОн поставил чай — зелёный, в керамических пиалах без ручек. Сел рядом, но не близко.\n\n— Первый раз?\n\n— Первый раз именно так.\n\nОн кивнул, понимая, о чём ты. Без объяснений.\n\n— Возвращаются многие. Не все за верёвками. Некоторые — за этим.\n\nОн кивнул на пространство между вами. На тишину. На возможность быть рядом, не притворяясь.\n\nТы подняла пиалу — керамика была горячей, почти обжигающей.\n\n— Я подумаю, — сказала ты.\n\n— Вы уже решили. Просто ещё не назвали это вслух.\n\nОн улыбнулся — впервые за весь вечер. Тихо, без зубов, просто в глазах.\n\nТы допила чай. И знала — вернёшься.',img:null,choices:[]},

};
function renderScene(id){
const app=document.getElementById('app');
const s=SCENES[id];
if(!s){app.innerHTML='<p style="text-align:center;padding:40px 20px">🌸 Конец</p><p style="text-align:center;font-size:14px;color:#a89080">Спасибо, что доверились</p>';return}
let html='';
if(s.img)html+=`<img class="scene-img" src="${s.img}" alt="">`;
html+=`<div class="scene-text">${s.text}</div>`;
if(s.choices.length){
html+='<div class="choices">';
for(const c of s.choices){html+=`<button class="choice-btn" onclick="renderScene('${c.target}')">${c.label}</button>`}
html+='</div>'
} else {
html+='<p style="text-align:center;color:#a89080;margin-top:30px">~ Конец истории ~</p>'
}
app.innerHTML=html;
window.scrollTo({top:0,behavior:'smooth'});
try{localStorage.setItem('shibari_scene',id)}catch(e){}
}
const saved=localStorage.getItem('shibari_scene');
renderScene(saved&&SCENES[saved]?saved:'s1_start');
</script>
</body>
</html>
