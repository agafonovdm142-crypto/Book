    <h1>Властный</h1>

<script>
const SCENES = {
    'g6_01':{text:'Ты пришла в кофейню у метро. Он сидел у окна, в черном свитере, очки, тонкая рамка. Руки вокруг чашки — длинные, аккуратные. Руки архитектора.\n\nСергей. Тридцать два. Не улыбается при встрече — просто кивает. Как будто ты уже договорились, и он ждал, пока ты вспомнишь.\n\n- Ты не опоздала, - говорит он. - Я пришел раньше. Потому что хотел выбрать место. За столиком у окна. Где никто не сядет рядом.\n\nОн говорит спокойно. Без напора. Но в каждом слове — решение, которое уже принято. Не спросом. Фактом.\n\n- Кофе? Или чай? Или я выберу за тебя?',img:'img/g6_01_cafe.jpg',choices:[{label:'Пусть выберет сам',target:'g6_02_he_chooses'},{label:'Скажи, что хочешь латте',target:'g6_02_latte'}]},
    'g6_02_he_chooses':{text:'Он не спрашивает бариста. Не смотрит меню. Просто поднимает два пальца — два американо. Черные. Без сахара.\n\n- Ты привык командовать? - спрашиваешь ты.\n\n- Я привык решать. Это разные вещи. Командуют — когда боятся, что не послушаются. Я просто знаю, чего хочу.\n\nКофе приходит. Горький, тёплый, правильный.\n\n- И чего ты хочешь? - спрашиваешь ты. Не вызовом. Интересом.\n\nОн снимает очки. Кладет их на стол. Смотрит на тебя — и ты понимаешь: под этой мягкостью — сталь. Не агрессия. Уверенность.\n\n- Хочу, чтобы ты сделала выбор. Не сейчас. Потом. Но знала, что выбираешь — меня. И всё, что с этим.\n\n- А что \'с этим\'?\n\nОн улыбается. Впервые. Медленно.\n\n- Придешь — узнаешь.',img:null,choices:[{label:'Спросить, куда приходить',target:'g6_03_where'},{label:'Сказать, что подумаешь',target:'g6_03_think'}]},
    'g6_02_latte':{text:'- Латте, - говоришь ты. - С корицей.\n\nОн смотрит на тебя. Два секунды. Потом поворачивается к бариста:\n\n- Латте. Одну.\n\n- Одну? - переспрашиваешь ты. - А ты?\n\n- Я пью американо. Но сегодня — твой выбор. Я буду смотреть, как ты пьешь свой латте. Это интереснее.\n\nОн садится напротив. Не касается тебя. Но ты чувствуешь — он «здесь». Полностью. Как будто в комнате никого больше нет.\n\n- Ты всегда так смотришь? - спрашиваешь ты.\n\n- Только на то, что хочу запомнить.\n\nЛатте приходит. Ты пьешь. Он смотрит. Не навязчиво. Настойчиво. Как будто ты — картина, которую он собирается рисовать. С натуры.',img:null,choices:[{label:'Спросить, что он видит',target:'g6_03_see'},{label:'Предложить пойти гулять',target:'g6_03_walk'}]},
    'g6_03_where':{text:'- Куда приходить? - спрашиваешь ты.\n\nОн достает ручку. Пишет адрес на салфетке. Почерк — аккуратный, архитектурный. Каждая буква — на своем месте.\n\n- Моя квартира. Суббота. Девять вечера. Не раньше — я закончу проект. Не позже — я не жду.\n\nТы берешь салфетку. Адрес — в старом доме, центр. Высокие потолки, наверное. Паркет. Кованые перила.\n\n- А если я не приду?\n\n- Буду работать. Я не жду. Я предлагаю. Придешь — хорошо. Нет — я не обижусь. Но не буду просить.\n\nОн надевает очки. Встает. Оставляет деньги — без счета, точную сумму.\n\n- До субботы. Не звони. Не пиши. Просто приди. Или нет.',img:null,choices:[{label:'Кивнуть, не говоря слова',target:'g6_04_nod'},{label:'Сказать \'приду\'',target:'g6_04_come'}]},
    'g6_03_think':{text:'- Мне нужно подумать, - говоришь ты.\n\nОн кивает. Не удивлен. Не расстроен. Просто — принимает.\n\n- Думай. Не торопись. Но знай: я не буду напоминать. Не буду звонить. Одно приглашение. Одна дверь. Один вечер.\n\nОн достает визитку. Белая, плотная. Только имя и адрес. Ничего больше.\n\n- Если придешь — стучи три раза. Не в звонок. В дверь. Я открою. Если не открою — уходи. Значит, я передумал. Или ты опоздала.\n\nТы берешь визитку. Тяжелая. Настоящая.\n\n- Почему три?\n\n- Чтобы я знал, что это ты. Не курьер. Не сосед. Ты.\n\nОн уходит первым. Не оглядывается. Ты смотришь на визитку. Суббота кажется очень далеко — и очень близко.',img:null,choices:[{label:'Прийти в субботу',target:'g6_04_arrive'},{label:'Не прийти, но пожалеть',target:'g6_04_regret'}]},
    'g6_03_see':{text:'- Что ты видишь? - спрашиваешь ты.\n\nОн молчит. Два глотка кофе. Потом:\n\n- Вижу женщину, которая привыкла контролировать. Которая устала быть сильной. Которая хочет — хотя бы ночь — позволить кому-то другому.\n\nТы замерзаешь. Потому что он прав. И потому что ты никому не говорила.\n\n- Не бойся, - он наклоняется ближе. Голос — шелковый, тихий. - Я не читаю мысли. Я читаю тело. Твои плечи напряжены. Руки сжаты. Ты держишь мир на них. Можно положить. Хотя бы на час.\n\n- А ты? - шепчешь ты. - Ты устал?\n\n- Я устал от женщин, которые боятся. Я хочу ту, которая не боится отпустить.\n\nОн кладет руку тебе на запястье. Легко. Не сжимая. Но ты чувствуешь: он может сжать. Если захочет. И ты — позволишь.',img:null,choices:[{label:'Не убирать руку',target:'g6_04_touch'},{label:'Спросить, что будет дальше',target:'g6_04_next'}]},
    'g6_03_walk':{text:'- Пойдем гулять? - предлагаешь ты.\n\nОн смотрит на часы. Не наручные — карманные, старомодные.\n\n- У меня двадцать минут. Потом — встреча. Но двадцать минут достаточно, чтобы понять, стоит ли возвращаться.\n\nОн встает. Ждет у двери. Не открывает — смотрит, как ты справишься сама. Не из невежества. Из наблюдения.\n\nУлица вечерняя, серая. Он идет рядом — не берет за руку, но его плечо касается твоего каждые несколько шагов. Намеренно. Ровно.\n\n- Знаешь, что хорошо в архитектуре? - спрашивает он. - Там все по правилам. Нагрузка. Пролет. Материал. Но внутри правил — красота. Свобода в рамках. Это я.\n\nТы понимаешь: он описывает себя. И то, что будет.',img:null,choices:[{label:'Спросить про его квартиру',target:'g6_04_home'},{label:'Сказать, что хочешь увидеть',target:'g6_04_want'}]},
    'g6_04_arrive':{text:'Ты пришла. Девять ноль-ноль. Три стука — тихих, ровных.\n\nДверь открывается сразу. Он знал, что придешь.\n\nЧерный свитер. Джинсы. Босиком. В квартире — тепло, пахнет сандалом и чем-то металлическим. Кованое всюду — перила, светильники, кровать в соседней комнате. Ты видишь её краем глаза. Черное железо. Высокие столбы. Наручи — кожаные, на цепях.\n\n- Ты видела, - не вопрос. - Не бойся. Это не приговор. Это — возможность.\n\nОн берет тебя за подбородок. Нежно. Но ты не можешь отвести взгляд.\n\n- Хочешь — скажи \'стоп\'. В любой момент. Одно слово — и всё кончится. Но пока ты молчишь — ты моя.\n\nТы молчишь. Не из страха. Из выбора.\n\n- Хорошая девочка, - шепчет он. - Повернись.',img:'img/g6_02_bedroom.jpg',choices:[{label:'Повернуться',target:'g6_05_blindfold'},{label:'Сказать \'стоп\' и уйти',target:'g6_05_stop'}]},
    'g6_05_blindfold':{text:'Ты поворачиваешься. Его руки — на твоих плечах. Потом он поднимает что-то мягкое. Шелк. Черный. Завязывает тебе глаза.\n\nМир исчезает. Только его запах — сандал, кожа, кофе. Его голос — рядом с ухом, тихий, но отдающийся всем телом.\n\n- Теперь ты видишь только то, что я позволю. Чувствуешь — только то, что я дам. Ты здесь не для того, чтобы думать. Ты здесь — чтобы чувствовать.\n\nЕго губы касаются твоей шеи. Сзади. Ты вздрагиваешь — не от холода.\n\n- Не двигайся, - приказывает он. Не просит. Приказывает. - Стой. Дыши. Доверься.\n\nИ ты стоишь. В темноте шелка. И понимаешь: потеряв контроль, ты нашла свободу.',img:'img/g6_03_blindfold.jpg',choices:[{label:'Слушаться',target:'g6_06_belt'},{label:'Перевернуть игру',target:'g6_06_reverse'}]},
    'g6_06_belt':{text:'- Руки за спину, - говорит он.\n\nТы подчиняешься. Он снимает ремень — медленно, через петли. Кожа мягкая, потертая. Он связывает твои запястья. Не туго — ты можешь вырваться, если захочешь. Но ты не хочешь.\n\n- Хорошо, - шепчет он у тебя в волосах. - Очень хорошо.\n\nОн подхватывает тебя на руки — легко, как перо. Несет. Ты чувствуешь ковку под спиной — холодное железо, потом его тепло сверху.\n\nНаручи на кровати. Кожаные. Он расстегивает один — осторожно, как ювелир. Закрывает твою ладонь. Щелчок. Теперь ты связана кроватью. Не жестоко. Красиво.\n\n- Теперь, - говорит он, - начинается.\n\nТы не видишь. Только чувствуешь. Его губы. Его руки. Его голос — который говорит, что делать. И ты делаешь. Потому что хочешь. Потому что выбрала. Потому что свобода — в отпускании.',img:'img/g6_04_bed.jpg',choices:[{label:'Сдаться полностью',target:'g6_07_surrender'},{label:'Попросить его снять повязку',target:'g6_07_see'}]},
    'g6_06_reverse':{text:'Ты поворачиваешься в его объятиях. Быстро. Лбом почти касаешься его.\n\n- А если я хочу командовать? - шепчешь ты.\n\nОн замирает. Потом улыбается — в темноте ты слышишь это в его голосе.\n\n- Тогда командуй. Но знай: я позволяю. Это — мой выбор.\n\nТы толкаешь его к кровати. Он подчиняется — не потому что слабый. Потому что хочет. Он ложится. Ты садишься сверху. Повязка все еще на тебе — и это усиливает. Ты не видишь его глаз. Только чувствуешь его дыхание. Его руки на твоих бедрах. Его — внутри.\n\n- Теперь ты моя, - шепчешь ты.\n\n- Всегда был. Просто ждал, когда ты это поймешь.',img:'img/g6_04_bed.jpg',choices:[{label:'Остаться на ночь',target:'g6_07_night'},{label:'Уйти до рассвета',target:'g6_07_dawn'}]},
    'g6_05_stop':{text:'- Стоп.\n\nСлово вылетает до того, как ты успеваешь подумать. Он отпускает тебя сразу. Не спорит. Не умоляет. Просто — отступает на шаг.\n\n- Хорошо. Дверь там. Куртка на вешалке.\n\nТы стоишь. Не двигаешься. Потому что понимаешь: ты не хочешь уходить. Ты хочешь, чтобы он убедил. Но он не будет.\n\n- Я... я не знаю, чего хочу, - признаешься ты.\n\n- Знаешь. Просто боишься. Это нормально. Страх — тоже выбор. Но не сегодня. Придешь, когда будешь готова. Я буду здесь.\n\nОн открывает дверь. Не выгоняет. Просто — дает возможность уйти. Или остаться.\n\nТы уходишь. Но знаешь: вернешься. Потому что нигде больше не было такого — когда тебя слушали. Когда \'нет\' значило \'нет\'. Когда уважение было сексуальнее прикосновения.',img:null,choices:[]},
    'g6_07_surrender':{text:'Ты сдаешься. Полностью. Не потому что слабая — потому что можешь.\n\nОн чувствует это. Его руки становятся мягче. Голос — тише. Он берет тебя так, как будто ты — хрусталь. Но не отпускает. "Ни на миг.\n\nПосле — он снимает повязку. Медленно. Свет режет глаза, но ты видишь его лицо. Впервые — без маски. Без контроля. Просто мужчина, который держит тебя, как будто ты — всё.\n\n- Ты вернула мне что-то, - шепчет он. - Веру, что можно быть осторожным и страстным. Сильным и нежным.\n\n- Ты вернул мне веру, что контроль — это не всегда хорошо.\n\nОн смеется. Ты смеешься. Кованая кровать скрипит под вами.\n\nУтром он варит кофе — в той же чашке, что в кофейне. Ты смотришь на наручи — пустые, на подушке. И улыбаешься.',img:'img/g6_05_morning.jpg',choices:[]},
    'g6_07_see':{text:'- Сними повязку, - просишь ты. - Хочу видеть тебя.\n\nОн молчит. Два вдоха. Потом снимает. Медленно.\n\nСвет слепит. Потом — он. Весь. Глаза темные, влажные. Губы сжаты.\n\n- Ты первая, кто попросил, - говорит он. - Все остальные хотели темноты. Анонимности. А ты...\n\n- Я хочу тебя. Не тень. Тебя.\n\nОн целует тебя. Долго. Как будто впервые. Потом развязывает ремень. Потом наручи. Ты свободна — но не уходишь.\n\nОн берет тебя по-настоящему. Не властно. Не командуя. Два равных. Два голодных. Два — кто нашли друг друга в темноте и решили остаться на свету.\n\n- Теперь я всегда буду снимать повязку, - говорит он после. - Если ты рядом — зачем темнота?\n\nТы засыпаешь на его груди. Наручи лежат рядом — ненужные. Потому что связь сильнее цепей.',img:'img/g6_05_morning.jpg',choices:[]},
    'g6_07_night':{text:'Ты остаешься. Ночь. Кованая кровать становится вашей.\n\nОн не повторяет игру — не нужно. Вы оба знаете, что она возможна. Этого достаточно. Сейчас он просто обнимает тебя. Крепко. Долго.\n\n- Я никому не рассказывал, - говорит он в темноте. - Про кровать. Про наручи. Про то, чего хочу. Боялся, что подумают — странный. Жестокий.\n\n- Ты не жестокий. Ты честный. Это редкость.\n\n- А ты — смелая. Прийти. Остаться. Выбрать меня — со всеми моими стенами и коваными перилами.\n\n- Стены можно ломать. А перила — держаться.\n\nОн смеется. Впервые — громко. Открыто.\n\n- Ты — архитектор моей жизни, - шепчет он. - Строй, что хочешь. Я доверяю.',img:'img/g6_05_morning.jpg',choices:[]},
    'g6_07_dawn':{text:'Ты уходишь до рассвета. Одеваешься в темноте. Он лежит, смотрит.\n\n- Уходишь? - спрашивает он. Без обиды. Просто факт.\n\n- Мне нужно подумать. Не о тебе. О себе. О том, что я чувствую.\n\n- Думай. Я не буду звонить. Но дверь открыта. Всегда.\n\nТы целуешь его лоб. Он ловит твою руку. Целует запястье — там, где был ремень. След еще теплый.\n\n- Возвращайся. Не потому что должна. Потому что захочешь снова потерять контроль.\n\nТы уходишь. На лестнице — кованые перила, похожие на те, что на кровати. Ты улыбаешься. Потому что знаешь: он спроектировал это намеренно. Чтобы ты вспоминала. Каждый раз, касаясь перил.',img:null,choices:[]},
    'g6_04_nod':{text:'Ты киваешь. Он кивает в ответ. И уходит — первым, как всегда.\n\nСуббота приходит быстро. Слишком быстро. Ты стоишь у двери — старая, деревянная, с кованой ручкой. Три стука.\n\nОн открывает. Черный свитер. Босиком. В квартире — полумрак. Только свечи. И запах сандала.\n\n- Ты пришла, - говорит он. - Я знал.\n\n- Как?\n\n- Потому что ты — та, кто не говорит, а делает.\n\nОн берет тебя за руку. Ведет вглубь. К кровати.\n\n- Помнишь слово?\n\n- Стоп.\n\n- Хорошо. Начинаем.',img:'img/g6_02_bedroom.jpg',choices:[{label:'Слушаться',target:'g6_05_blindfold'}]},
    'g6_04_come':{text:'- Приду, - говоришь ты. Просто. Без тени сомнения.\n\nОн смотрит на тебя. Два секунды. Потом кивает — одобрение, не прощание.\n\nСуббота. Девять. Три стука. Он открывает. Не улыбается — просто отступает, давая войти.\n\nВ квартире — тепло, полумрак, сандал. Кованая кровать видна через дверь. Наручи лежат на подушке. Готовые.\n\n- Ты знала, что увидишь, - говорит он. - И все равно пришла.\n\n- Пришла не потому что хочу быть связанной. Пришла потому что хочу довериться. Это разное.\n\n- Я знаю. Потому что ждал именно тебя.\n\nОн подходит. Близко. Его рука — на твоей шее. Пальцы касаются пульса.\n\n- Нервничаешь. Хорошо. Нервы — это жизнь.',img:'img/g6_02_bedroom.jpg',choices:[{label:'Повернуться',target:'g6_05_blindfold'}]},
    'g6_04_touch':{text:'Ты не убираешь руку. Он не убирает свою. Его пальцы на твоем запястье — легкие, но ты чувствуешь силу. Не использованную. Сохраненную.\n\n- Ты не боишься, - говорит он. Не вопрос.\n\n- Боюсь. Но не убегаю.\n\n- Это то, что я искал. Женщину, которая боится, но остается.\n\nОн оплачивает кофе. Не спрашивая — просто делает. Ведет тебя к двери.\n\n- Моя квартира. Десять минут ходьбы. Если пойдешь со мной — я не спрошу разрешения. Ни на что. Но остановлюсь, если скажешь \'стоп\'.\n\nТы идешь. Рука в руке. Не потому что должна. Потому что хочешь знать, каково это — когда кто-то другой решает.\n\nДверь захлопывается. Кованая кровать. Наручи. Повязка. Все, что он обещал.',img:'img/g6_02_bedroom.jpg',choices:[{label:'Повернуться',target:'g6_05_blindfold'}]},
    'g6_04_next':{text:'- Что будет дальше? - спрашиваешь ты.\n\nОн смотрит на часы. Снова карманные. Старомодные.\n\n- Дальше — моя квартира. Десять минут. Если пойдешь — я покажу. Если нет — допьешь кофе. И мы забудем друг друга.\n\n- Жестоко.\n\n- Честно. Я не верю в \'давайте останемся друзьями\'. Я верю в выбор. Твой. Мой. Наш.\n\nТы встаешь. Не потому что должна. Потому что любопытство сильнее страха.\n\nОн улыбается. Не широко. Достаточно.\n\n- Хорошая девочка, - шепчет он. - Пойдем.',img:'img/g6_02_bedroom.jpg',choices:[{label:'Повернуться',target:'g6_05_blindfold'}]},
    'g6_04_home':{text:'- Расскажи про свою квартиру, - просишь ты.\n\nОн молчит. Потом:\n\n- Старый дом. Высокие потолки. Паркет, который скрипит. Кованые перила — я сам проектировал. И кровать. Тоже своя.\n\n- Кровать?\n\n- Кованая. Черное железо. Наручи на цепях. Не для всех. Для тех, кто знает, чего хочет.\n\n- А для меня?\n\nОн останавливается. Смотрит на тебя — прямо, без очков, без защиты.\n\n- Для тебя — если придешь. Девять вечера. Суббота. Три стука.\n\nТы приходишь. Конечно, приходишь.',img:'img/g6_02_bedroom.jpg',choices:[{label:'Повернуться',target:'g6_05_blindfold'}]},
    'g6_04_want':{text:'- Я хочу увидеть, - говоришь ты. - Все. Тебя. Твою квартиру. Твои стены.\n\nОн кивает. Как будто ждал именно этого. Не \'пойдем\' — \'хочу увидеть\'.\n\n- Тогда идем. Сейчас. Не суббота. Сейчас.\n\nОн ведет тебя. Быстро, но не торопя. Десять минут — молчание, которое не тяжелое. Наполненное.\n\nДверь. Кованая ручка. Он открывает — не тебе, а для тебя. Разница есть.\n\nСвечи. Сандал. И кровать — черное железо, наручи, цепи.\n\n- Ты не боишься? - спрашивает он.\n\n- Боюсь. Но хочу больше, чем боюсь.\n\n- Это — все, что мне нужно знать.',img:'img/g6_02_bedroom.jpg',choices:[{label:'Повернуться',target:'g6_05_blindfold'}]},
    'g6_04_regret':{text:'Ты не пришла. Суббота прошла. Девять вечера — ты сидела дома, смотрела в стену.\n\nНе потому что боялась его. Потому что боялась себя. Той, которая хотела прийти. Которая хотела сдаться.\n\nНеделя спустя ты возвращаешься в кофейню. Его нет. Бариста говорит: он уволился. Уехал. Никто не знает куда.\n\nТы выходишь. На тротуаре — мелкий дождь. Или слезы. Ты не различаешь.\n\nПотом, месяц спустя, ты получаешь открытку. Без текста. Только адрес. И три точки. Как три стука.\n\nТы идешь. Конечно, идешь. Потому что некоторые двери открываются только после того, как ты поняла, что потеряла.',img:null,choices:[]}
};
let currentScene = 'g6_01';
let sceneHistory = [];
function renderScene(sceneId) {
  const scene = SCENES[sceneId];
  if (!scene) return;
  currentScene = sceneId;
  if(typeof trackScene==="function")trackScene(sceneId);
  sceneHistory.push(sceneId);
  const app = document.getElementById('app');
  let html = '<div class="fade-in">';
  if (scene.img) {
    html += '<img class="scene-img" src="' + scene.img + '" alt="" onload="this.classList.add(\'loaded\')">';
  }
  html += '<div class="scene-text">' + scene.text.replace(/\n/g, '<br>') + '</div>';
  if (scene.choices.length > 0) {
    html += '<div class="choices">';
    scene.choices.forEach(function(c) {
      html += '<button class="choice-btn" onclick="choose(\'' + c.target + '\')">' + c.label + '</button>';
    });
    html += '</div>';
  } else {
    if(typeof trackComplete==='function')trackComplete();
    html += '<div class="end-marker"><p>~ Конец главы ~</p><p style="margin-top:10px;font-size:0.9em">Живая Книга</p></div>';
  }
  html += '</div>';
  app.innerHTML = html;
  const maxDepth = 5;
  const progress = Math.min((sceneHistory.length / maxDepth) * 100, 100);
  document.getElementById('progressFill').style.width = progress + '%';
  window.scrollTo({top:0,behavior:'smooth'});
}
function choose(targetId) { renderScene(targetId); }
renderScene(currentScene);
</script>
