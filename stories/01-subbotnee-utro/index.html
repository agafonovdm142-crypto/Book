let currentSceneId = 'scene_01_wake';
let history = [];

function renderScene(sceneId) {
  const scene = scenes[sceneId];
  if (!scene) return;
  currentSceneId = sceneId;
  history.push(sceneId);
  const app = document.getElementById('app');
  const isDialogue = (t) => t.startsWith('—') || t.startsWith('«') || t.startsWith('"');
  const paragraphs = scene.text.split('\n\n').map((p, i) => {
    const cls = isDialogue(p) ? 'paragraph dialogue' : 'paragraph';
    const delay = i * 0.06;
    return `<p class="${cls}" style="animation-delay:${delay}s">${p}</p>`;
  }).join('');
  const single = scene.choices.length === 1;
  const choicesHtml = scene.choices.map((c, i) => {
    const prefix = single ? '<span class="choice-arrow">→</span>' : `<span class="choice-prefix">${String.fromCharCode(65+i)}.</span>`;
    const delay = i * 0.06;
    return `<button class="choice-btn" style="animation-delay:${delay}s" onclick="handleChoice('${c.next}')">${prefix}${c.text}</button>`;
  }).join('');
  const progress = Math.min((history.length / 40) * 100, 100);
  app.innerHTML = `
    <div class="app-container">
      <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
      <div class="image-section">
        <img class="scene-image" src="${scene.img}" alt="${scene.location}" onerror="this.src='./img/napkin-number.jpg'">
        <div class="image-gradient"></div>
        <div class="scene-labels">
          <span class="scene-label location">${scene.location}</span>
          <span class="scene-label time">${scene.time}</span>
        </div>
      </div>
      <div class="text-section scrollbar-hide">
        <div class="text-content">${paragraphs}</div>
        <div class="choices-container">${choicesHtml}</div>
      </div>
      <div class="bottom-gradient"></div>
    </div>`;
  const ts = app.querySelector('.text-section');
  if (ts) ts.scrollTop = 0;
}

function handleChoice(next) {
  if (event && event.target) event.target.classList.add('selected');
  setTimeout(() => renderScene(next), 250);
}

window.onload = () => renderScene('scene_01_wake');
</script>
