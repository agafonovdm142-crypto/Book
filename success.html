<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Оплата успешна — Живая Книга</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Open+Sans:wght@300;400&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Open Sans',sans-serif;background:#0e0a08;color:#f5ede4;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:40px 20px}
  .container{max-width:480px;width:100%;text-align:center}
  .check{font-size:4em;color:#5a7a5a;margin-bottom:20px}
  .title{font-family:'Cormorant Garamond',serif;font-size:2em;color:#d4af89;margin-bottom:15px}
  .desc{color:#c8b5a5;font-size:1em;line-height:1.7;margin-bottom:30px}
  .btn{width:100%;padding:14px;background:#d4af89;color:#0e0a08;border:none;border-radius:8px;font-family:'Cormorant Garamond',serif;font-size:1.2em;cursor:pointer;text-decoration:none;display:inline-block;transition:all 0.3s;margin-bottom:10px}
  .btn:hover{background:#c9a67a}
  .btn-sec{padding:12px;background:transparent;color:#d4af89;border:1px solid rgba(212,175,137,0.3);border-radius:8px;font-size:0.9em;cursor:pointer;text-decoration:none;display:inline-block;transition:all 0.3s}
  .btn-sec:hover{border-color:#d4af89}
  .gift{color:#a89080;font-size:0.85em;margin-top:25px;font-style:italic}
</style>
</head>
<body>
<div class="container">
  <div class="check">✓</div>
  <div class="title">Оплата прошла успешно!</div>
  <div class="desc">
    Добро пожаловать в «Живую Книгу».<br><br>
    Все 6 глав, все истории, все концовки — теперь твои.<br>
    Читай где угодно, когда угодно.<br><br>
    Приятного чтения.
  </div>
  <a href="/" class="btn">📖 Начать чтение</a>
  <a href="https://t.me/Jivaya_kniga_bot" class="btn-sec">🤖 Открыть в Telegram</a>
  <div class="gift">«История — это не слова на странице. Это то, что ты чувствуешь, переворачивая её.»</div>
</div>
</body>
</html>
