<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Живая Книга — Субботнее утро</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7B2D4C">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body,#app{width:100%;height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:#FAF6F1;color:#1E1A18}
.scrollbar-hide::-webkit-scrollbar{display:none}
.scrollbar-hide{-ms-overflow-style:none;scrollbar-width:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideRight{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse-glow{0%,100%{box-shadow:0 0 0 0 rgba(123,45,76,.25)}50%{box-shadow:0 0 0 10px rgba(123,45,76,0)}}
@keyframes progressBar{from{width:0%}to{width:100%}}
@keyframes spinLoad{to{transform:rotate(360deg)}}
.font-serif{font-family:'Playfair Display',serif}

/* Loading */
.loading-screen{position:fixed;inset:0;background:#FAF6F1;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000}
.loading-spinner{width:40px;height:40px;border:3px solid #7B2D4C;border-top-color:transparent;border-radius:50%;animation:spinLoad 1s linear infinite}
.loading-text{margin-top:16px;color:#8A8580;font-size:14px}

/* Progress bar */
.progress-track{position:fixed;top:0;left:0;right:0;height:3px;background:#E8E4E0;z-index:50}
.progress-fill{height:100%;background:linear-gradient(to right,#7B2D4C,#C8956C);transition:width .5s ease}

/* Image area */
.image-section{position:relative;height:40vh;width:100%;flex-shrink:0}
.scene-image{width:100%;height:100%;object-fit:cover;display:block}
.image-gradient{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 60%,#FAF6F1)}
.scene-labels{position:absolute;top:16px;left:16px;display:flex;gap:8px}
.scene-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:2px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);padding:4px 12px;border-radius:20px}
.scene-label.location{color:#8A8580}
.scene-label.time{color:#C8956C}

/* Text area */
.text-section{flex:1;overflow-y:auto;padding:16px 24px 100px}
.text-content{max-width:560px;margin:0 auto}
.paragraph{margin-bottom:14px;line-height:1.7;font-size:15px;animation:fadeIn .4s ease forwards;opacity:0}
.paragraph.dialogue{font-family:'Playfair Display',serif;font-style:italic;font-size:16px;color:#7B2D4C}

/* Choices */
.choices-container{max-width:560px;margin:28px auto 40px;display:flex;flex-direction:column;gap:12px;animation:fadeInUp .4s ease}
.choice-btn{padding:16px 20px;border-radius:16px;border:2px solid rgba(123,45,76,.15);background:rgba(255,255,255,.75);color:#1E1A18;cursor:pointer;text-align:left;font-size:15px;font-family:'Inter',sans-serif;line-height:1.5;backdrop-filter:blur(8px);transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,.04);animation:slideRight .3s ease forwards;opacity:0}
.choice-btn:hover{transform:scale(1.02);border-color:#7B2D4C;box-shadow:0 4px 20px rgba(123,45,76,.2)}
.choice-btn:active{transform:scale(.98)}
.choice-btn.selected{background:linear-gradient(135deg,#7B2D4C,#9B3D5C);color:#fff;border-color:#7B2D4C;box-shadow:0 4px 20px rgba(123,45,76,.3)}
.choice-btn.pulse{animation:pulse-glow 2s infinite}
.choice-prefix{font-weight:600;margin-right:8px;opacity:.6}
.choice-arrow{margin-right:8px;opacity:.5}

/* Bottom gradient */
.bottom-gradient{position:fixed;bottom:0;left:0;right:0;height:50px;background:linear-gradient(to top,#F5E6D8,transparent);pointer-events:none;z-index:10}

/* App layout */
.app-container{height:100vh;width:100%;background:linear-gradient(to bottom,#FAF6F1,#F5E6D8);display:flex;flex-direction:column;overflow:hidden;position:relative}
</style>
</head>
<body>
<div id="app">
  <div class="loading-screen">
    <div class="loading-spinner"></div>
    <div class="loading-text">Загружаем историю...</div>
  </div>
</div>

<script>
// ===== DATA: ALL SCENES =====
const scenes = {
  'scene_01_wake': {
    location: 'Спальня', time: '08:30',
    text: `Субботнее утро в твоём городе. Сквозь полуприоткрытые шторы пробивается солнце — золотые лучи полосами ложатся на подушку, на одеяло, на твою руку, лежащую на краю простыни. За окном шумит ветер и слышно чириканье птиц.\n\nТы лежишь одна. В комнате тепло — батарея шипит у окна. Пахнет свежим постельным бельём: лавандовый порошок и чем-то своим, уютным.\n\nТелефон на тумбочке показывает 8:30. Целый день впереди.\n\nТы вчера решила — сегодня позавтракаешь вне дома. Новое кафе открылось неподалёку, «Мокко» называется. Отзывы хвалят круассаны.`,
    img: 'https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=800&q=80',
    choices: [
      { text:'Поваляться ещё 15 минут, наслаждаясь теплом', next:'scene_02_dress' },
      { text:'Встать сразу — хочу успеть к открытию', next:'scene_02_dress' },
      { text:'Взять телефон, проверить соцсети', next:'scene_02_dress' },
    ]
  },
  'scene_02_dress': {
    location: 'Гардероб', time: '09:00',
    text: `Ты стоишь перед зеркалом в полный рост. Завтрак в кафе — ничего особенного, но суббота… почему бы и не нарядиться?\n\nТы снимаешь ночную сорочку — тонкий шёлк скользит по коже, и ты ловишь своё отражение. Утренний свет мягкий, ласковый. Ты видишь себя: плечи, линию шеи, талию, которая кажется уже утром. И мелькает мысль: сегодня ты будешь желанной. Не для кого-то конкретно. Просто — в этот день, в этом городе, в этом теле.\n\n«Пусть будет» — шепчешь ты себе, открывая шкаф.`,
    img: 'https://images.unsplash.com/photo-1558618047-f4b511056e36?w=800&q=80',
    choices: [
      { text:'Струящаяся юбочка миди + белая рубашка', next:'scene_03_cafe' },
      { text:'Облегающие джинсы + топ с открытыми плечами', next:'scene_03_cafe' },
      { text:'Платье-рубашка хаки, слегка застёгнутое', next:'scene_03_cafe' },
    ]
  },
  'scene_03_cafe': {
    location: 'Кафе «Мокко»', time: '09:30',
    text: `Кафе оказалось чудом.\n\nПанорамные окна от пола до потолка, и солнце заливает всё золотом. Деревянные столы — светлый дуб, на каждом по маленькой вазе с полевыми цветами. На подоконниках — пионы, белые и розовые, и от них пахнет сладковато, летне.\n\nВоздух в кафе — свежемолотый кофе, топлёное масло круассанов, что-то цитрусовое.\n\nТы садишься за столик у окна. Солнце ласково греет щёку.\n\n— Что будете заказывать? — голос молодой, почти нежный, с лёгкой хрипотцой.\n\nТы поднимаешь глаза.`,
    img: 'https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=800&q=80',
    choices: [
      { text:'Продолжить...', next:'scene_04_lesha' },
    ]
  },
  'scene_04_lesha': {
    location: 'Кафе «Мокко»', time: '09:32',
    text: `Перед тобой стоит парень. Лет двадцать — такой молодой, что ты сначала думаешь, работает ли он здесь легально. Но потом видишь фартук, и всё встаёт на место.\n\nОн симпатичный — не красавец из журнала, а по-настоящему, живой. Прямолинейная челюсть, слегка растрёпанные светлые волосы, веснушки на носу — редкие. Взгляд хитроватый — он смотрит на тебя не как официант на клиента, а как человек, который что-то заметил.\n\nНа шее виднеется татуировка. Тонкая линия папоротника, уходящая под ключицу.\n\nОт него пахнет — свежим молотым кофе, чем-то цитрусовым, может, гель для душа, и ещё… молодостью. Той самой, горячей, которая не притворяется.\n\n— Круассан с миндалём и латте, — говоришь ты.\n\n— Лавандовый сироп добавить? — он улыбается, и улыбка кривая, левая сторона поднимается выше правой. — У нас новый. Получается неплохо.`,
    img: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=800&q=80',
    choices: [
      { text:'Сделать вид, что не заметила татуировку', next:'scene_05_prosecco' },
      { text:'Слегка улыбнуться, глядя на татуировку', next:'scene_05_prosecco' },
      { text:'Спросить прямо: «Что за тату?»', next:'scene_05_prosecco' },
    ]
  },
  'scene_05_prosecco': {
    location: 'Кафе «Мокко»', time: '09:45',
    text: `Заказ пришёл быстро. Круассан — хрустящий, маслянистый, с миндальной пастой внутри. Латте с лавандовым сиропом — нежный, цветочный.\n\nМинут через десять он возвращается. В руке у него не счёт, а бокал.\n\nТонкий, хрустящий бокал для игристого. В нём — золотистая жидкость, и пузырьки играют, ловя солнечные лучи.\n\n— Prosecco. От заведения, — говорит он, ставя бокал перед тобой. — Для самой красивой гостьи этого утра.\n\nУхмылка — та самая, кривая. Он не ждёт ответа. Поправляет фартук и отходит к стойке.`,
    img: 'https://images.unsplash.com/photo-1510812431401-41d2bd2722f2?w=800&q=80',
    choices: [
      { text:'«Слишком рано?» — но взять бокал', next:'scene_05b_prosecco_reply' },
      { text:'Сказать спасибо, улыбнуться и отпить молча', next:'scene_05b_prosecco_reply' },
      { text:'«Часто так радуете гостей?» — с улыбкой', next:'scene_05b_prosecco_reply' },
    ]
  },
  'scene_05b_prosecco_reply': {
    location: 'Кафе «Мокко»', time: '09:47',
    text: `Ты берёшь бокал — холодное стекло приятно обжигает пальцы. Пузырьки лопаются на губах, и prosecco оказывается именно таким: сухим, с лёгкой горчинкой, заставляющим улыбнуться.\n\nОн стоит за стойкой и смотрит. Не подходит — просто смотрит.\n\n— Только тех, кто знает, что суббота — это святое, — отзывается он.\n\n— А если я не верю в святость?\n\n— Тогда вы здесь зря. Но бокал уже допили — так что, может, начинаете верить.\n\nОн смеётся, и смех молодой, беззаботный, тот, который заражает.`,
    img: 'https://images.unsplash.com/photo-1517457373958-b7bdd4587205?w=800&q=80',
    choices: [
      { text:'Продолжить...', next:'scene_06_number' },
    ]
  },
  'scene_06_number': {
    location: 'Кафе «Мокко»', time: '10:15',
    text: `Ты допила prosecco — пузырьки делают тебя чуть-чуть счастливее с каждым глотком. Заказала второй кофе — эспрессо, маленький, горький, контрастный после сладости.\n\nКогда пришло время уходить, он принёс счёт на подносе. Но вместе со счётом — маленькую салфетку. Белую. На ней цифры и… сердце. Нарисованное от руки, кривое, по-детски.\n\n— Мой номер, — говорит он, не глядя на тебя. — На случай, если захочешь… пообщаться позже.\n\nОн встал и пошёл к стойке, даже не дожидаясь ответа.`,
    img: 'https://images.unsplash.com/photo-1517457373958-b7bdd4587205?w=800&q=80',
    choices: [
      { text:'Спрятать салфетку в сумочку — решу позже', next:'scene_06c_lingerie' },
      { text:'Написать свой номер и оставить на столе', next:'scene_06c_lingerie' },
      { text:'«А если я не позвоню?» — с улыбкой', next:'scene_06c_lingerie' },
    ]
  },
  'scene_06c_lingerie': {
    location: 'Твоя квартира', time: '10:45',
    text: `Ты возвращаешься домой с лёгким головокружением — prosecco на тощак, солнце в волосах, номер незнакомца в сумочке.\n\nНо сейчас — душ. Горячая вода стекает по плечам, и ты закрываешь глаза. Ты моешь волосы — шампунь пахнет жасмином, пена шёлковая. В запотевшем зеркале — овалы, тени, намёки на контуры.\n\nА потом — бельё. Ты открываешь ящик комода.\n\nПотому что бельё — это не про кого-то. Это про себя. Про то, как ты чувствуешь себя, зная, что под платьем — что-то прекрасное.\n\n«Женщина, которая чувствует себя желанной под своей одеждой, — светится изнутри», — говорила подруга. Ты тогда рассмеялась. Сейчас понимаешь.`,
    img: 'https://images.unsplash.com/photo-1617331721458-bd3bd3f9c7f8?w=800&q=80',
    choices: [
      { text:'Чёрное кружево: тонкие лямки, вышивка на бедрах, ткань почти просвечивает', next:'scene_06d_gallery_dress' },
      { text:'Шёлк цвета слоновой кости: скользит по коже, холодный сначала, потом тепло тела', next:'scene_06d_gallery_dress' },
      { text:'Бордо, глубокое: кружево по краю, контраст с кожей, дерзкое и женственное', next:'scene_06d_gallery_dress' },
    ]
  },
  'scene_06d_gallery_dress': {
    location: 'Гардероб', time: '11:00',
    text: `Ты смотришь на себя в зеркало: «Я хочу быть красивой сегодня. Не для кого-то. Для себя. Чтобы зайти в галерею и чувствовать, что каждый шаг — это мой».\n\nПальцы перебирают платья. А под платьем — твой секрет. Тонкий слой кружева или шёлка, который никто не увидит, но который делает тебя немного выше, увереннее, своей.\n\nТы пробуешь каждое платье, поворачиваясь боком — линия талии, плавный изгиб бедра, шея…`,
    img: 'https://images.unsplash.com/photo-1496747611176-843222e1e57c?w=800&q=80',
    choices: [
      { text:'Тёмно-зелёное wrap-платье: запах на талии, юбка до колена, шея открыта', next:'scene_07_gallery' },
      { text:'Чёрное платье-комбинация: шёлковое, кружево по вырезу, простое и дорогое', next:'scene_07_gallery' },
      { text:'Платье с цветочным принтом: юбка летит при ходьбе, пояс из той же ткани', next:'scene_07_gallery' },
    ]
  },
  'scene_07_gallery': {
    location: 'Галерея «Арт-Пространство»', time: '11:30',
    text: `«Арт-Пространство» — ты видела афишу на столбе у метро. Выставка молодых художников, последний день.\n\nВнутри прохладно. Белые стены, высокие потолки, скрип паркета под ногами. Картины — абстракции, портреты, что-то между сном и реальностью.\n\nТы проходишь мимо полотен, и платье слегка колышется. Ты чувствуешь себя заметной. Не яркой — просто женщиной, которая пришла смотреть искусство и сама похожа на часть картины.\n\nТы стоишь перед полотном — на нём женщина, танцующая в огне.\n\n— Она горит каждый день, — говорит голос позади. — И выходит невредимой. Думаю, автор верит в чудеса.`,
    img: 'https://images.unsplash.com/photo-1531913764164-f85c52e6e654?w=800&q=80',
    choices: [
      { text:'Обернуться', next:'scene_08_max' },
    ]
  },
  'scene_08_max': {
    location: 'Галерея «Арт-Пространство»', time: '11:35',
    text: `Ты оборачиваешься.\n\nПеред тобой мужчина. Тридцать пять, может, чуть больше — возраст не в лице, а в том, как он стоит. Спокойно, так, будто земля ровная только потому, что он решил, что так будет.\n\nТёмные волосы, слегка седые на висках. Глаза карие, тёплые — смотрят не в упор, а как будто издалека: изучают, думают. На мгновение ты ловишь его взгляд на своей шее, на линии платья, и он не смущается — просто переводит взгляд выше, к глазам.\n\nОт него пахнет — дорогими сигаретами, которых он уже не курит, чем-то древесным, может, ладан или кедр, и ещё… решимостью. Той, которая не кричит, а просто есть.\n\n— Макс, — представляется он. — Искусствовед. Или куратор. Зависит от дня.\n\nЕго рука — тёплая, сухая, сильная.\n\n— Пойдёмте, покажу кое-что. Не то что все смотрят.`,
    img: 'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=800&q=80',
    choices: [
      { text:'Пойти с ним', next:'scene_09_hall' },
      { text:'«А если я предпочитаю то, что смотрят все?»', next:'scene_09_hall' },
    ]
  },
  'scene_09_hall': {
    location: 'Галерея — закрытый зал', time: '11:50',
    text: `Он ведёт тебя в конец коридора, к двери «Закрыто — реставрация». Дверь приоткрыта.\n\nВнутри — тусклый свет, одна картина на мольберте. На ней — обнажённая женщина, спина к зрителю, смотрящая в окно.\n\n— Она принадлежала известному коллекционеру, — говорит Макс, стоя рядом. — Пропала на сорок лет. Никто не знал, что существовала.\n\nТы смотришь на холст. Женщина стоит у окна, и свет ложится на её спину — кажется, она светится изнутри.\n\n— Почему показываете мне?\n\n— Потому что вы посмотрели на «танцовщицу» не так, как остальные. Вы просто… чувствовали.\n\nОн поворачивается. В полутьме глаза темнее.\n\n— Хотите посмотреть остальное?`,
    img: 'https://images.unsplash.com/photo-1578321272176-b7bbc0679853?w=800&q=80',
    choices: [
      { text:'Да, хочу', next:'scene_10_choice' },
      { text:'«Это закрытый зал? Или личное приглашение?»', next:'scene_10_choice' },
    ]
  },
  'scene_10_choice': {
    location: 'Галерея — закрытый зал', time: '12:00',
    text: `Ты стоишь в полутьме, и воздух густой — как перед грозой, как перед первым поцелуем.\n\nМакс ждёт. Не торопит. Умеет ждать.\n\nВ сумочке — номер Лёши. С папоротником на шее и prosecco в 9 утра.\n\nУтро подарило двух мужчин. Один — молодой, дерзкий. Другой — зрелый, смотрящий так, будто знает твою историю.\n\nКого выберешь?`,
    img: 'https://images.unsplash.com/photo-1518998053901-5348d3961a04?w=800&q=80',

// ===== APP =====
let currentSceneId = 'scene_01_wake';
let history = [];

function renderScene(sceneId) {
  const scene = scenes[sceneId];
  if (!scene) return;

  currentSceneId = sceneId;
  history.push(sceneId);

  const app = document.getElementById('app');
  const isDialogue = (text) => text.startsWith('—') || text.startsWith('«') || text.startsWith('"');
  const paragraphs = scene.text.split('\n\n').map((p, i) => {
    const cls = isDialogue(p) ? 'paragraph dialogue font-serif' : 'paragraph';
    const delay = i * 0.08;
    return `<p class="${cls}" style="animation-delay:${delay}s">${p}</p>`;
  }).join('');

  const singleChoice = scene.choices.length === 1;
  const choicesHtml = scene.choices.map((c, i) => {
    const prefix = singleChoice ? '<span class="choice-arrow">→</span>' : `<span class="choice-prefix">${String.fromCharCode(65+i)}.</span>`;
    const pulse = singleChoice ? 'pulse' : '';
    const delay = i * 0.08;
    return `<button class="choice-btn ${pulse}" style="animation-delay:${delay}s" onclick="handleChoice('${c.next}')">${prefix}${c.text}</button>`;
  }).join('');

  const progressPct = Math.min((history.length / 20) * 100, 100);

  app.innerHTML = `
    <div class="app-container">
      <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
      <div class="image-section">
        <img class="scene-image" src="${scene.img}" alt="${scene.location}" onerror="this.src='https://images.unsplash.com/photo-1518998053901-5348d3961a04?w=800&q=80'">
        <div class="image-gradient"></div>
        <div class="scene-labels">
          <span class="scene-label location">${scene.location}</span>
          <span class="scene-label time">${scene.time}</span>
        </div>
      </div>
      <div class="text-section scrollbar-hide">
        <div class="text-content">
          ${paragraphs}
        </div>
        <div class="choices-container">
          ${choicesHtml}
        </div>
      </div>
      <div class="bottom-gradient"></div>
    </div>
  `;

  // Scroll to top
  const textSection = app.querySelector('.text-section');
  if (textSection) textSection.scrollTop = 0;
}

function handleChoice(nextSceneId) {
  // Add selected state
  event.target.classList.add('selected');
  setTimeout(() => renderScene(nextSceneId), 300);
}

// Init
window.onload = () => renderScene('scene_01_wake');
