const scenes = {
  'scene_01_wake': {
    sceneId: 'scene_01_wake', location: 'Спальня', time: '08:30',
    text: `Субботнее утро в твоём городе. Сквозь полуприоткрытые шторы пробивается солнце — золотые лучи полосами ложатся на подушку, на одеяло, на твою руку, лежащую на краю простыни. За окном шумит ветер и слышно чириканье птиц.\n\nТы лежишь одна. В комнате тепло — батарея шипит у окна. Пахнет свежим постельным бельём: лавандовый порошок и чем-то своим, уютным.\n\nТелефон на тумбочке показывает 8:30. Целый день впереди.\n\nТы вчера решила — сегодня позавтракаешь вне дома. Новое кафе открылось неподалёку, «Мокко» называется. Отзывы хвалят круассаны.`,
    img: 'https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=800&q=80',
    choices: [
      { id:'c1_stay', text:'Поваляться ещё 15 минут, наслаждаясь теплом', next:'scene_02_dress' },
      { id:'c1_rush', text:'Встать сразу — хочу успеть к открытию', next:'scene_02_dress' },
      { id:'c1_phone', text:'Взять телефон, проверить соцсети', next:'scene_02_dress' },
    ]
  },

  'scene_02_dress': {
    sceneId: 'scene_02_dress', location: 'Гардероб', time: '09:00',
    text: `Ты стоишь перед зеркалом в полный рост. Завтрак в кафе — ничего особенного, но суббота… почему бы и не нарядиться?\n\nТы снимаешь ночную сорочку — тонкий шёлк скользит по коже, и ты ловишь своё отражение. Утренний свет мягкий, ласковый. Ты видишь себя: плечи, линию шеи, талию, которая кажется уже утром. И мелькает мысль: сегодня ты будешь желанной. Не для кого-то конкретно. Просто — в этот день, в этом городе, в этом теле.\n\n«Пусть будет» — шепчешь ты себе, открывая шкаф.`,
    img: 'https://images.unsplash.com/photo-1522335789203-abd6523f4374?w=800&q=80',
    choices: [
      { id:'c2_skirt', text:'Струящаяся юбочка миди + белая рубашка', next:'scene_03_cafe' },
      { id:'c2_jeans', text:'Облегающие джинсы + топ с открытыми плечами', next:'scene_03_cafe' },
      { id:'c2_dress', text:'Платье-рубашка хаки, слегка застёгнутое', next:'scene_03_cafe' },
    ]
  },

  'scene_03_cafe': {
    sceneId: 'scene_03_cafe', location: 'Кафе «Мокко»', time: '09:30',
    text: `Кафе оказалось чудом.\n\nПанорамные окна от пола до потолка, и солнце заливает всё золотом. Деревянные столы — светлый дуб, на каждом по маленькой вазе с полевыми цветами. На подоконниках — пионы, белые и розовые, и от них пахнет сладковато, летне.\n\nВоздух в кафе — свежемолотый кофе, топлёное масло круассанов, что-то цитрусовое.\n\nТы садишься за столик у окна. Солнце ласково греет щёку.\n\n— Что будете заказывать? — голос молодой, почти нежный, с лёгкой хрипотцой.\n\nТы поднимаешь глаза.`,
    img: 'https://images.unsplash.com/photo-1442512595331-e89e73853f31?w=800&q=80',
    choices: [
      { id:'c3_continue', text:'Продолжить...', next:'scene_04_lesha' },
    ]
  },

  'scene_04_lesha': {
    sceneId: 'scene_04_lesha', location: 'Кафе «Мокко»', time: '09:32',
    text: `Перед тобой стоит парень. Лет двадцать — такой молодой, что ты сначала думаешь, работает ли он здесь легально. Но потом видишь фартук, и всё встаёт на место.\n\nОн симпатичный — не красавец из журнала, а по-настоящему, живой. Прямолинейная челюсть, слегка растрёпанные светлые волосы, веснушки на носу — редкие. Взгляд хитроватый — он смотрит на тебя не как официант на клиента, а как человек, который что-то заметил.\n\nНа шее виднеется татуировка. Тонкая линия папоротника, уходящая под ключицу.\n\nОт него пахнет — свежим молотым кофе, чем-то цитрусовым, может, гель для душа, и ещё… молодостью. Той самой, горячей, которая не притворяется.\n\n— Круассан с миндалём и латте, — говоришь ты.\n\n— Лавандовый сироп добавить? — он улыбается, и улыбка кривая, левая сторона поднимается выше правой. — У нас новый. Получается неплохо.`,
    img: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=800&q=80',
    choices: [
      { id:'c4_ignore', text:'Сделать вид, что не заметила татуировку', next:'scene_05_prosecco' },
      { id:'c4_smile', text:'Слегка улыбнуться, глядя на татуировку', next:'scene_05_prosecco' },
      { id:'c4_ask', text:'Спросить прямо: «Что за тату?»', next:'scene_05_prosecco' },
    ]
  },

  'scene_05_prosecco': {
    sceneId: 'scene_05_prosecco', location: 'Кафе «Мокко»', time: '09:45',
    text: `Заказ пришёл быстро. Круассан — хрустящий, маслянистый, с миндальной пастой внутри. Латте с лавандовым сиропом — нежный, цветочный.\n\nМинут через десять он возвращается. В руке у него не счёт, а бокал.\n\nТонкий, хрустящий бокал для игристого. В нём — золотистая жидкость, и пузырьки играют, ловя солнечные лучи.\n\n— Prosecco. От заведения, — говорит он, ставя бокал перед тобой. — Для самой красивой гостьи этого утра.\n\nУхмылка — та самая, кривая. Он не ждёт ответа. Поправляет фартук и отходит к стойке.`,
    img: 'https://images.unsplash.com/photo-1470337458703-46ad1756a187?w=800&q=80',
    choices: [
      { id:'c5_early', text:'«Слишком рано?» — но взять бокал', next:'scene_05b_prosecco_reply' },
      { id:'c5_silent', text:'Сказать спасибо, улыбнуться и отпить молча', next:'scene_05b_prosecco_reply' },
      { id:'c5_laugh', text:'«Часто так радуете гостей?» — с улыбкой', next:'scene_05b_prosecco_reply' },
    ]
  },

  'scene_05b_prosecco_reply': {
    sceneId: 'scene_05b_prosecco_reply', location: 'Кафе «Мокко»', time: '09:47',
    text: `Ты берёшь бокал — холодное стекло приятно обжигает пальцы. Пузырьки лопаются на губах, и prosecco оказывается именно таким: сухим, с лёгкой горчинкой, заставляющим улыбнуться.\n\nОн стоит за стойкой и смотрит. Не подходит — просто смотрит.\n\n— Только тех, кто знает, что суббота — это святое, — отзывается он.\n\n— А если я не верю в святость?\n\n— Тогда вы здесь зря. Но бокал уже допили — так что, может, начинаете верить.\n\nОн смеётся, и смех молодой, беззаботный, тот, который заражает.`,
    img: 'https://images.unsplash.com/photo-1554118811-1e0d58224f24?w=800&q=80',
    choices: [
      { id:'c5b_continue', text:'Продолжить...', next:'scene_06_number' },
    ]
  },

  'scene_06_number': {
    sceneId: 'scene_06_number', location: 'Кафе «Мокко»', time: '10:15',
    text: `Ты допила prosecco — пузырьки делают тебя чуть-чуть счастливее с каждым глотком. Заказала второй кофе — эспрессо, маленький, горький, контрастный после сладости.\n\nКогда пришло время уходить, он принёс счёт на подносе. Но вместе со счётом — маленькую салфетку. Белую. На ней цифры и… сердце. Нарисованное от руки, кривое, по-детски.\n\n— Мой номер, — говорит он, не глядя на тебя. — На случай, если захочешь… пообщаться позже.\n\nОн встал и пошёл к стойке, даже не дожидаясь ответа.`,
    img: 'https://images.unsplash.com/photo-1517457373958-b7bdd4587205?w=800&q=80',
    choices: [
      { id:'c6_save', text:'Спрятать салфетку в сумочку — решу позже', next:'scene_06c_lingerie' },
      { id:'c6_napkin', text:'Написать свой номер и оставить на столе', next:'scene_06c_lingerie' },
      { id:'c6_ask', text:'«А если я не позвоню?» — с улыбкой', next:'scene_06c_lingerie' },
    ]
  },

  'scene_06c_lingerie': {
    sceneId: 'scene_06c_lingerie', location: 'Твоя квартира', time: '10:45',
    text: `Ты возвращаешься домой с лёгким головокружением — prosecco на тощак, солнце в волосах, номер незнакомца в сумочке.\n\nНо сейчас — душ. Горячая вода стекает по плечам, и ты закрываешь глаза. Ты моешь волосы — шампунь пахнет жасмином, пена шёлковая. В запотевшем зеркале — овалы, тени, намёки на контуры.\n\nА потом — бельё. Ты открываешь ящик комода.\n\nПотому что бельё — это не про кого-то. Это про себя. Про то, как ты чувствуешь себя, зная, что под платьем — что-то прекрасное.\n\n«Женщина, которая чувствует себя желанной под своей одеждой, — светится изнутри», — говорила подруга. Ты тогда рассмеялась. Сейчас понимаешь.`,
    img: 'https://images.unsplash.com/photo-1617331721458-bd3bd3f9c7f8?w=800&q=80',
    choices: [
      { id:'c6c_lace', text:'Чёрное кружево: тонкие лямки, вышивка на бедрах, ткань почти просвечивает', next:'scene_06d_gallery_dress' },
      { id:'c6c_silk', text:'Шёлк цвета слоновой кости: скользит по коже, холодный сначала, потом тепло тела', next:'scene_06d_gallery_dress' },
      { id:'c6c_red', text:'Бордо, глубокое: кружево по краю, контраст с кожей, дерзкое и женственное', next:'scene_06d_gallery_dress' },
    ]
  },

  'scene_06d_gallery_dress': {
    sceneId: 'scene_06d_gallery_dress', location: 'Гардероб', time: '11:00',
    text: `Ты смотришь на себя в зеркало: «Я хочу быть красивой сегодня. Не для кого-то. Для себя. Чтобы зайти в галерею и чувствовать, что каждый шаг — это мой».\n\nПальцы перебирают платья. А под платьем — твой секрет. Тонкий слой кружева или шёлка, который никто не увидит, но который делает тебя немного выше, увереннее, своей.\n\nТы пробуешь каждое платье, поворачиваясь боком — линия талии, плавный изгиб бедра, шея…`,
    img: 'https://images.unsplash.com/photo-1496747611176-843222e1e57c?w=800&q=80',
    choices: [
      { id:'c6d_wrap', text:'Тёмно-зелёное wrap-платье: запах на талии, юбка до колена, шея открыта', next:'scene_07_gallery' },
      { id:'c6d_black', text:'Чёрное платье-комбинация: шёлковое, кружево по вырезу, простое и дорогое', next:'scene_07_gallery' },
      { id:'c6d_floral', text:'Платье с цветочным принтом: юбка летит при ходьбе, пояс из той же ткани', next:'scene_07_gallery' },
    ]
  },

  'scene_07_gallery': {
    sceneId: 'scene_07_gallery', location: 'Галерея «Арт-Пространство»', time: '11:30',
    text: `«Арт-Пространство» — ты видела афишу на столбе у метро. Выставка молодых художников, последний день.\n\nВнутри прохладно. Белые стены, высокие потолки, скрип паркета под ногами. Картины — абстракции, портреты, что-то между сном и реальностью.\n\nТы проходишь мимо полотен, и платье слегка колышется. Ты чувствуешь себя заметной. Не яркой — просто женщиной, которая пришла смотреть искусство и сама похожа на часть картины.\n\nТы стоишь перед полотном — на нём женщина, танцующая в огне.\n\n— Она горит каждый день, — говорит голос позади. — И выходит невредимой. Думаю, автор верит в чудеса.`,
    img: 'https://images.unsplash.com/photo-1531913764164-f85c52e6e654?w=800&q=80',
    choices: [
      { id:'c7_turn', text:'Обернуться', next:'scene_08_max' },
    ]
  },

  'scene_08_max': {
    sceneId: 'scene_08_max', location: 'Галерея «Арт-Пространство»', time: '11:35',
    text: `Ты оборачиваешься.\n\nПеред тобой мужчина. Тридцать пять, может, чуть больше — возраст не в лице, а в том, как он стоит. Спокойно, так, будто земля ровная только потому, что он решил, что так будет.\n\nТёмные волосы, слегка седые на висках. Глаза карие, тёплые — смотрят не в упор, а как будто издалека: изучают, думают. На мгновение ты ловишь его взгляд на своей шее, на линии платья, и он не смущается — просто переводит взгляд выше, к глазам.\n\nОт него пахнет — дорогими сигаретами, которых он уже не курит, чем-то древесным, может, ладан или кедр, и ещё… решимостью. Той, которая не кричит, а просто есть.\n\n— Макс, — представляется он. — Искусствовед. Или куратор. Зависит от дня.\n\nЕго рука — тёплая, сухая, сильная.\n\n— Пойдёмте, покажу кое-что. Не то что все смотрят.`,
    img: 'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=800&q=80',
    choices: [
      { id:'c8_go', text:'Пойти с ним', next:'scene_09_hall' },
      { id:'c8_caution', text:'«А если я предпочитаю то, что смотрят все?»', next:'scene_09_hall' },
    ]
  },

  'scene_09_hall': {
    sceneId: 'scene_09_hall', location: 'Галерея — закрытый зал', time: '11:50',
    text: `Он ведёт тебя в конец коридора, к двери «Закрыто — реставрация». Дверь приоткрыта.\n\nВнутри — тусклый свет, одна картина на мольберте. На ней — обнажённая женщина, спина к зрителю, смотрящая в окно.\n\n— Она принадлежала известному коллекционеру, — говорит Макс, стоя рядом. — Пропала на сорок лет. Никто не знал, что существовала.\n\nТы смотришь на холст. Женщина стоит у окна, и свет ложится на её спину — кажется, она светится изнутри.\n\n— Почему показываете мне?\n\n— Потому что вы посмотрели на «танцовщицу» не так, как остальные. Вы просто… чувствовали.\n\nОн поворачивается. В полутьме глаза темнее.\n\n— Хотите посмотреть остальное?`,
    img: 'https://images.unsplash.com/photo-1578321272176-b7bbc0679853?w=800&q=80',
    choices: [
      { id:'c9_yes', text:'Да, хочу', next:'scene_10_choice' },
      { id:'c9_hesitate', text:'«Это закрытый зал? Или личное приглашение?»', next:'scene_10_choice' },
    ]
  },

  'scene_10_choice': {
    sceneId: 'scene_10_choice', location: 'Галерея — закрытый зал', time: '12:00',
    text: `Ты стоишь в полутьме, и воздух густой — как перед грозой, как перед первым поцелуем.\n\nМакс ждёт. Не торопит. Умеет ждать.\n\nВ сумочке — номер Лёши. С папоротником на шее и prosecco в 9 утра.\n\nУтро подарило двух мужчин. Один — молодой, дерзкий. Другой — зрелый, смотрящий так, будто знает твою историю.\n\nКого выберешь?`,
    img: 'https://images.unsplash.com/photo-1518998053901-5348d3961a04?w=800&q=80',
    choices: [
      { id:'c10_lesha', text:'Позвонить Лёше. Суббота только началась.', next:'scene_ending_lesha' },
      { id:'c10_max', text:'Остаться с Максом. В закрытом зале.', next:'scene_max_kiss' },
      { id:'c10_self', text:'Уйти одной. Сегодня — мой день.', next:'scene_ending_self' },
    ]
  },

  // === МАКС: постельная линия ===
  'scene_max_kiss': {
    sceneId: 'scene_max_kiss', location: 'Галерея — закрытый зал', time: '12:05',
    text: `Ты не отвечаешь. Не нужно — он читает по глазам.\n\nМакс делает шаг ближе. Не касается тебя — просто становится так близко, что ты чувствуешь тепло его тела, тот самый запах кедра и ладана, и что-то ещё… мускусное, мужское, то, что нельзя купить в флаконе.\n\nОн поднимает руку к твоей шее — не спеша, давая время отстраниться. Ты не отстраняешься. Пальцы касаются кожи под ухом, и мурашки бегут вниз по спине.\n\nПотом — медленно, так, будто у вас есть вечность — он наклоняется и целует тебя. Не в губы сразу. В уголок рта. В щёку. В шею. И снова в губы — и тогда уже всерьёз, глубоко, так, что ты забываешь, где находишься.\n\n— Крыша, — шепчет он на твоих губах. — У меня есть ключ.`,
    img: 'https://images.unsplash.com/photo-1518568814500-bf0f8d125f46?w=800&q=80',
    choices: [
      { id:'c_kiss_roof', text:'Пойти на крышу с ним', next:'scene_max_roof' },
    ]
  },

  'scene_max_roof': {
    sceneId: 'scene_max_roof', location: 'Крыша галереи', time: '12:20',
    text: `Крыша оказалась… ничейной. Небольшая, с парапетом по краю, на котором можно сидеть. Внизу — город, шумящий, живой, но сюда до него почти не доходит. Ветер сильнее, и солнце прямо над головой.\n\nМакс закрывает дверь на ключ. Теперь здесь только вы двое.\n\nОн подходит сзади и обнимает — руки на талии, подбородок на макушке. Вы стоите, смотря на город, и его дыхание греет волосы.\n\n— Ты холодная, — говорит он.\n\n— Ветер.\n\n— Не ветер.\n\nОн разворачивает тебя к себе лицом. Пальцы скользят по линии платья — по шее, по ключице, по запаху. Застёжка легко расстёгивается. Платье падает на плечи, на бёдра, на пол.\n\nПод ним — то самое бельё, которое ты так тщательно выбирала. Он замирает, смотря.\n\n— Ты знала, что выберешь меня, — шепчет он.\n\n— Нет.\n\n— А я знал.`,

  'scene_max_bed': {
    sceneId: 'scene_max_bed', location: 'Крыша галереи', time: '12:30',
    text: `Он целует тебя снова — на этот раз без церемоний, глубоко, с языком, с тем самым вкусом, который теперь ты узнаешь: ладан, кофе и что-то горячее, его собственное.\n\nРуки Макса скользят по лямкам белья — чёрного, шёлкового, того, что ты выбрала утром, думая о себе. Он снимает их медленно, целуя каждый участок кожи, который открывается: плечи, ключицы, грудь, живот… Бюстгальдер падает. Тюль снимается с бёдер легким движением.\n\nТы стоишь перед ним в одном только солнце и ветре, и он смотрит — не жадно, не похотливо, а так, будто запоминает каждую линию, каждый изгиб, каждую тень.\n\n— Ложись, — говорит он тихо, и это не приказ — это просьба.\n\nОн укладывает тебя на платье, разостланное по бетону — холодный сначала, но теплеющее от тела. Он снимает свой пиджак, расстёгивает рубашку. Торс — сильный, с шрамом на ребре, с тёмными волосками, сходящими к поясу. Брюки.\n\nОн наваливается на тебя всем телом — тяжёлым, мужским, горячим. Разводит твои бёдра коленом, руками, легко, но настойчиво. Ты чувствуешь его между ног — твёрдый, горячий, упершийся в тебя.\n\nИ врывается.\n\nСначала — неглубоко. Один. Второй. Третий. Короткие, быстрые, щекочущие. Он смотрит тебе в глаза, и ты видишь, как он контролирует себя, как напрягаются мышцы его плеч.\n\nПотом — один глубокий. Медленный. До самого конца. Ты выгибаешься, и он задерживается внутри, чувствуя, как ты сжимаешься вокруг него.\n\nИ снова: семь неглубоких, острых, почти игривых — и два глубоких, растянутых, таких, что воздух уходит из груди.\n\nШесть неглубоких, почти дразнящих, он улыбается сквозь зубы — и три медленных, глубоких, каждый длиннее предыдущего. Ты цепляешься пальцами за его плечи, оставляя следы, и он стонет в твою шею.\n\nПять коротких — ты уже не понимаешь, считать ли, — и четыре глубоких, без пауз между ними, сплошная волна, поднимающая тебя выше.\n\nЧетыре неглубоких, и он меняет угол, заходя сбоку — и пять глубоких, и ты кричишь, не сдерживаясь, потому что больше нет сил притворяться.\n\nТри неглубоких, он целует тебя, глотая стоны — и шесть глубоких, без остановки, без передышки, он двигает бёдрами в такт сердцебиению, которое слышит весь мир.\n\nДва неглубоких — издёвка, он знает, что ты близко — и семь глубоких, всё быстрее, всё сильнее, и ты чувствуешь, как внутри нарастает жар, температура, огонь, который невозможно потушить.\n\nОдин неглубокий.\n\nИ тогда он резким движением шлепает тебя по попке — хлопок, острый, щекащий, и в этот момент что-то внутри тебя переключается. Это ощущение — горячая ладонь на коже, внезапность, лёгкая жгучесть — запускает рост волны.\n\nДевять глубоких. Девять. Медленных вначале, потом стремительных, безумных, он бьётся об тебя всем телом.\n\nОргазм накатывает волной изнутри — не взрыв, а прилив, океан, который поднимается из самого центра тела. Ты чувствуешь, как внутри усиливается пульсация и жар, и вдруг прорывается поток «огненной лавы», который заполняет всё вокруг — всю тебя полностью, обволакивает член внутри твоей вагины, но места не хватает.\n\nТы чувствуешь, как сперма вытекает из тебя и начинает стекать по бёдрам — горячая, нет, огненная смесь его семени и твоей смазки. Ты не хочешь, чтобы он выходил — хочешь насладиться этим теплом и пульсацией его члена внутри, тем, как он наполняет тебя, как сердце его бьётся в такт с твоим.\n\nЗапах секса заполнил пространство — это запах пота, смазки обоих, семени, слюны, феромонов и жара, который всё поглотил. Ты вдыхаешь его, и это пьяно — собственный запах смешанный с его, создавая что-то третье, живое, первобытное.\n\nОн выходит из тебя медленно, и ты чувствуешь утрату — пустоту, которую хочется заполнить. Но девушке хочется больше вкуса от этого секса.\n\nТы опускаешься на колени и берёшь его член в рот — горячий, влажный, вкус обоих на нём, смесь твоей смазки и его семени. Ты высасываешь остатки, медленно, жадно, облизывая головку, ствол, переходя на яички, пока он не станет чистым, а ты не насытишься этим вкусом и запахом.\n\nОн смотрит на тебя сверху, тяжело дыша, пальцы запутались в твоих волосах, и в его взгляде — благодарность, восхищение и что-то похожее на страх перед тем, что ты с ним делаешь.\n\n— Ты… — начинает он, но голос срывается.\n\nТы встаёшь, и он садится на стул, который стоит у парапета. Ты стоишь перед ним, голая, в одном только солнце, и чувствуешь себя богиней. Он разворачивает тебя к себе попкой, руки на бёдрах, и нежно кусает за ягодицу — не очень сильно, но так, что ты это ясно чувствуешь: острый, мокрый укус, который оставит след.\n\n— Это чтобы помнила, — шепчет он.`,
    img: 'https://images.unsplash.com/photo-1519378058457-4c29a0a2efac?w=800&q=80',
    choices: [
      { id:'c_bed_after', text:'Лежать в его руках...', next:'scene_ending_max_after' },

  'scene_ending_max_after': {
    sceneId: 'scene_ending_max_after', location: 'Крыша галереи', time: '13:30',
    text: `Ты лежишь на нём, на том самом стуле, голова на его плече, ноги свисают. Его рука гладит твою спину — медленно, лениво, как будто у нас есть вечность. След от укуса на ягодице пульсирует приятной жгучестью.\n\n— Ты… — начинает он.\n\n— Тссс, — шепчешь ты, прикрывая ему губы пальцем. — Не говори. Просто лежи.\n\nИ он лежит. На крыше. Под солнцем. С запахом тебя на губах.\n\n*Продолжение следует…*`,

function StoryReader() {
  const [sceneId, setSceneId] = useState('scene_01_wake');
  const [textRevealed, setTextRevealed] = useState(false);
  const [showChoices, setShowChoices] = useState(false);
  const [selectedChoice, setSelectedChoice] = useState(null);
  const [history, setHistory] = useState([]);
  const textRef = useRef(null);

  const scene = scenes[sceneId];

  useEffect(() => {
    setTextRevealed(false);
    setShowChoices(false);
    setSelectedChoice(null);
    if (textRef.current) {
      textRef.current.scrollTop = 0;
    }
    const t1 = setTimeout(() => setTextRevealed(true), 200);
    const t2 = setTimeout(() => setShowChoices(true), scene ? scene.text.length * 7 + 400 : 800);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, [sceneId]);

  if (!scene) return (
    <div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#FAF6F1'}}>
      <div style={{width:40,height:40,border:'3px solid #7B2D4C',borderTopColor:'transparent',borderRadius:'50%',animation:'spin 1s linear infinite'}} />
    </div>
  );

  const handleChoice = (choice) => {
    setSelectedChoice(choice.id);
    setHistory([...history, scene.sceneId]);
    setTimeout(() => setSceneId(choice.next), 250);
  };

  const paragraphs = scene.text.split('\n\n');
  const singleChoice = scene.choices.length === 1;

  return (
    <div style={{height:'100vh',width:'100%',background:'linear-gradient(to bottom,#FAF6F1,#F5E6D8)',display:'flex',flexDirection:'column',overflow:'hidden',position:'relative'}}>
      
      {/* Progress bar */}
      <div style={{height:3,width:'100%',background:'#E8E4E0',position:'fixed',top:0,zIndex:50}}>
        <motion.div style={{height:'100%',background:'linear-gradient(to right,#7B2D4C,#C8956C)'}}
          initial={{width:'0%'}} animate={{width:`${Math.min((history.length/16)*100,100)}%`}} transition={{duration:0.5}} />
      </div>

      {/* Illustration */}
      <div style={{position:'relative',height:'40vh',width:'100%',flexShrink:0}}>
        <motion.img key={scene.img} src={scene.img} alt={scene.location}
          style={{width:'100%',height:'100%',objectFit:'cover'}}
          initial={{opacity:0,scale:1.05}} animate={{opacity:1,scale:1}} transition={{duration:0.6}} />
        <div style={{position:'absolute',inset:0,background:'linear-gradient(to bottom,transparent 60%,#FAF6F1)'}} />
        
        <div style={{position:'absolute',top:16,left:16,display:'flex',gap:8}}>
          <span style={{fontSize:11,fontWeight:600,textTransform:'uppercase',letterSpacing:2,color:'#8A8580',background:'rgba(255,255,255,0.85)',backdropFilter:'blur(8px)',padding:'4px 12px',borderRadius:20}}>{scene.location}</span>
          <span style={{fontSize:11,fontWeight:600,color:'#C8956C',background:'rgba(255,255,255,0.85)',backdropFilter:'blur(8px)',padding:'4px 12px',borderRadius:20}}>{scene.time}</span>
        </div>
      </div>

      {/* Text area */}
      <div ref={textRef} style={{flex:1,overflowY:'auto',padding:'16px 24px 100px'}} className="scrollbar-hide">
        <AnimatePresence mode="wait">
          <motion.div key={scene.sceneId}
            initial={{opacity:0,y:15}} animate={{opacity:textRevealed?1:0,y:textRevealed?0:15}}
            transition={{duration:0.4,delay:0.15}} style={{maxWidth:560,margin:'0 auto'}}>
            
            {paragraphs.map((p,i) => {
              const isDialogue = p.startsWith('—') || p.startsWith('«') || p.startsWith('"');
              return (
                <motion.p key={i} initial={{opacity:0}} animate={{opacity:1}} transition={{delay:i*0.08}}
                  style={{
                    marginBottom:14, lineHeight:1.7,
                    fontSize: isDialogue ? 16 : 15,
                    fontFamily: isDialogue ? "'Playfair Display',serif" : "'Inter',sans-serif",
                    fontStyle: isDialogue ? 'italic' : 'normal',
                    color: isDialogue ? '#7B2D4C' : '#1E1A18',
                  }}>
                  {p}
                </motion.p>
              );
            })}
          </motion.div>
        </AnimatePresence>

        {/* Choices */}
        <AnimatePresence>
          {showChoices && scene.choices.length > 0 && (
            <motion.div initial={{opacity:0,y:25}} animate={{opacity:1,y:0}} transition={{duration:0.4}}
              style={{maxWidth:560,margin:'28px auto 40px',display:'flex',flexDirection:'column',gap:12}}>
              
              {scene.choices.map((choice, idx) => (
                <motion.button key={choice.id} initial={{opacity:0,x:-15}} animate={{opacity:1,x:0}} transition={{delay:idx*0.08}}
                  onClick={() => handleChoice(choice)} whileHover={{scale:1.02}} whileTap={{scale:0.98}}
                  style={{
                    padding:'16px 20px', borderRadius:16, border:'2px solid',
                    borderColor: selectedChoice===choice.id ? '#7B2D4C' : 'rgba(123,45,76,0.15)',
                    background: selectedChoice===choice.id ? 'linear-gradient(135deg,#7B2D4C,#9B3D5C)' : 'rgba(255,255,255,0.75)',
                    color: selectedChoice===choice.id ? '#fff' : '#1E1A18', cursor:'pointer',
                    textAlign:'left', fontSize:15, fontFamily:"'Inter',sans-serif", lineHeight:1.5,
                    backdropFilter:'blur(8px)', transition:'all 0.2s',
                    boxShadow: selectedChoice===choice.id ? '0 4px 20px rgba(123,45,76,0.3)' : '0 2px 8px rgba(0,0,0,0.04)',
                    animation: singleChoice ? 'pulse-glow 2s infinite' : 'none',
                  }}>
                  {!singleChoice && <span style={{fontWeight:600,marginRight:8,opacity:0.6}}>{String.fromCharCode(65+idx)}.</span>}
                  {singleChoice && <span style={{marginRight:8,opacity:0.5}}>→</span>}
                  {choice.text}
                </motion.button>
              ))}
            </motion.div>
          )}
        </AnimatePresence>
      </div>

      <div style={{position:'fixed',bottom:0,left:0,right:0,height:50,background:'linear-gradient(to top,#F5E6D8,transparent)',pointerEvents:'none',zIndex:10}} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<StoryReader />);
</script>
</body>
</html>
